task:
  task_id: OSC-6-CONTRACT-RAW-PAIR-TYPED-PRODUCER-R4
  role: root
  mode: root_serial_private_typed_raw_pair_producer
  objective: >-
    Add a private pure producer that can derive exactly one existing R3
    ContractPerformanceEvidenceReceipt from a real R1 ContractComparisonReceipt,
    exact baseline/treatment TypedExecutionResult and EvidenceEnvelope pairs,
    immutable benchmark context, and typed raw counters.  The builder is a
    prerequisite only: it cannot create a canonical artifact, provenance
    admission, parallel-scaling authority, cohort, metric, publication, or gate
    decision.
  allowed_write_paths:
    - src/datadiff_osc/runtime/_phase6_contract_performance_producers.py
    - tests/osc/test_runtime_phase6_contract_performance_producers.py
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_raw_pair_typed_producer_task_contract.yaml
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_raw_pair_typed_producer_report.yaml
    - experiments/osc_v1/coordination_20260719_v1/coordination_ledger.yaml
  forbidden_write_paths:
    - src/datadiff_osc/__init__.py
    - src/datadiff_osc/public_api_freeze.json
    - src/datadiff_osc/search/**
    - src/datadiff_osc/contract_engine/**
    - src/datadiff_osc/runtime/_receipt_producers.py
    - tests/osc/test_runtime_receipt_producers.py
    - src/datadiff_osc/runtime/_producer_provenance.py
    - tests/osc/test_runtime_producer_provenance.py
    - src/datadiff_osc/runtime/_phase6_contract_performance_receipts.py
    - tests/osc/test_runtime_phase6_contract_performance_receipts.py
    - src/datadiff_osc/runtime/_semantic_replay.py
    - tests/osc/test_runtime_semantic_replay.py
    - src/datadiff_osc/_phase6_gate_authority.py
    - tests/osc/test_phase6_gate_authority_integration.py
    - src/datadiff_osc/runtime/_private_receipts.py
    - tests/osc/test_runtime_private_receipts.py
    - src/datadiff_osc/runtime/gates.py
    - src/datadiff_osc/runtime/gate_artifacts.py
    - src/datadiff_osc/contract_engine/_phase6_corpora.py
    - tests/osc/test_contract_phase6_corpora.py
    - tests/osc/test_search_context_receipts.py
    - tests/osc/test_search_gate_crosswalk.py
    - tests/osc/test_search_lane_registry.py
    - docs/**
    - scripts/**
    - experiments/final_bug_discovery_protocol_v3/**
  frozen_interfaces:
    - osc-public-api-freeze-v1:cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
    - osc-pre24-gate-spec-set-d9792996cacb6fc6e47bce602d5f7ab6d6382c62ba9e1ac6bc1f8003ecbec552
    - all thirteen frozen_target_sha256 entries above
    - R1 ContractComparisonReceipt v1
    - R3 ContractPerformanceEvidenceReceipt v1
  required_invariants:
    - >-
      The new module is private and pure.  It accepts no caller-authored
      receipt/sample/decision/result/task/config/environment/algorithm digest;
      every returned receipt identity is derived from typed objects and immutable
      canonical context.  The sole opaque locator is the R2 Contract producer
      receipt digest, which is carried only for the already-existing R3 Root
      cross-object check and is never treated as provenance by this builder.  It
      adds no public export.
    - >-
      A production observation must contain a real R1 ContractComparisonReceipt,
      two distinct TypedExecutionResult objects, and two distinct EvidenceEnvelope
      objects.  Both executions must be OK, have the same non-empty case ID,
      ResultGroup, ordered endpoint set, contract fingerprint, seed lineage,
      protocol, outcome endpoint, and resource envelope; their TaskSpec, result,
      outcome, evidence, and configuration identities must be distinct.
    - >-
      The comparison receipt is the sole source for source snapshot/case,
      comparison decision, ResultGroup/contract/endpoints, fingerprint/exact
      task/result, and partition fields.  The typed pair must bind exactly to
      that same ResultGroup and its exact verdict.  Evidence must bind exact
      result/task/seed/contract/target/outcome context, carry the same exact
      verdict, and remain NOT_A_CANDIDATE; no candidate may become confirmed and
      bug_claimed is never created or changed.
    - >-
      Benchmark plan, environment, and arm configuration are immutable uniquely
      sorted field tuples.  Strategy labels are not caller-selectable: baseline
      is always_materialize_pairwise and treatment is staged_exact_escalation.
      The derived arm configuration binds the corresponding TaskSpec payload and
      resource envelope.  The comparison algorithm identity is derived from the
      R1 comparison object, never supplied as a digest-only assertion.
    - >-
      Raw counters are typed integers only.  The builder derives bytes,
      backend-pair comparisons, and comparison CPU nanoseconds; all baseline
      values must be positive and all treatment values non-negative.  Booleans,
      floats, negatives, missing/duplicate/unordered context, mismatched source
      or verdict, unsupported evidence state, same identities, and stale or
      uninspectable inputs fail closed before a receipt is returned.
    - >-
      This contract deliberately does not alter R3 Runtime replay/Root binding,
      the frozen producer-provenance registry, or legacy PairedBenchmarkReceipt.
      The old parallel_scaling_samples path remains fail closed and cannot be
      silently filled, relaxed, or re-admitted by this implementation.
    - >-
      No raw artifact/provenance admission, 1000-pair cohort, 100000 corpus,
      bootstrap, metric reduction, gate spec, gate calculation, performance
      pass, Contract pass, combined suite, Phase 7, 2h pilot, or 24h run is
      authorized.  Missing exact typed context remains fail-closed/not_evaluated.
  required_tests:
    负向复核:
      - >-
        Reject an execution or evidence binding that no longer matches the
        comparison ResultGroup/endpoint/contract/fingerprint/exact task/result/
        partition context, plus case/seed/protocol/resource divergence, duplicate
        task/result/outcome/evidence/configuration, wrong evidence
        task/result/seed/outcome/verdict/state, and any raw-counter type or range
        violation before returning a receipt.  A separately valid changed source
        comparison may only derive a distinct receipt identity, never the old one.
      - >-
        Reject unordered, duplicated, empty, or strategy-spoofed benchmark,
        environment, and arm configuration context; no digest-only or
        caller-authored receipt identity may substitute for typed input.
    独立反例验证:
      - >-
        Build one legal R1 receipt and two legal typed executions, then mutate
        precisely one binding at a time.  Verify the returned R3 receipt derives
        all comparison and execution fields, changes identity when a raw
        observation changes, and never makes a bundle, candidate, or gate
        publishable.
    异常输入验证:
      - >-
        Exercise null-like/missing typed context, wrong object types, non-OK
        outcomes, non-NOT_A_CANDIDATE evidence, unequal exact verdicts, boolean/
        float/negative counters, zero baseline counters, and zero treatment
        counters without confirmation, bug claim, publication, or authorization.
  scoped_validation:
    command: >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      tests/osc/test_runtime_phase6_contract_performance_producers.py
      tests/osc/test_runtime_phase6_contract_performance_receipts.py
    timing: exactly once, only after all allowed implementation writes and SHA checks
    forbidden_substitutes:
      - tests/osc
      - repository suite
      - six-file combined suite
      - 100000 parity execution
      - v3 2200
      - Phase 7
      - 2h pilot
      - 24h run
  completion_requirements:
    - reverify both product paths and all thirteen frozen/public SHA values before the scoped suite
    - retain the exact command, exit code, and complete terminal result in the report
    - reverify both product paths and all thirteen frozen/public SHA values after the scoped suite
    - use apply_patch for the report and ledger only after the real terminal result is known
    - retain phase_6_contract as pending regardless of scoped-suite outcome
  stop_conditions:
    - any frozen/public SHA mismatch, staged user path, pre-existing target path, or scope expansion
    - any need to modify a public export, R1/R3 receipt/replay/Root, frozen producer/provenance/test, gate spec, docs, or script
    - any caller-authored digest identity, accepted misbound typed input, accepted old paired receipt, accepted parallel authority, publishable bundle, gate pass, candidate confirmation, or bug_claimed=true
    - failed scoped suite or incomplete terminal test evidence
