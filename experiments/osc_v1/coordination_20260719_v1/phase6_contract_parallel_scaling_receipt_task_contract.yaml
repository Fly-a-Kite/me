    - all thirteen frozen_target_sha256 entries above
    - frozen ParallelScalingObservation / WorkerBoundExecutionResult / RawCounterMeasurement
    - legacy PairedBenchmarkReceipt remains diagnostic-only
  required_invariants:
    - >-
      The replacement receipt is private, versioned, canonical, and has a
      derived sample identity.  It carries source snapshot, workload,
      benchmark/environment and distinct one-worker/six-worker configuration
      context, exact logical task-set and result/evidence digests, worker counts
      fixed at 1 and 6, and the complete raw monotonic task-counter start/end/
      clock/interval context for both arms.
    - >-
      All digest fields use the canonical SHA-256/namespaced-digest grammar;
      task sets are equal, result/evidence/configuration identities are distinct,
      both raw task counts are positive and equal, both intervals are positive,
      timestamps never run backwards, and the two arms share one clock domain.
      Caller-provided sample IDs, elapsed scalars, efficiencies, aggregates,
      booleans, floats, negatives, malformed digests, stale schemas, or missing
      fields fail closed.
    - >-
      Runtime alone performs strict exact-field reconstruction and canonical
      round-trip of the new receipt.  It exposes exactly the
      parallel_scaling_samples intrinsic subject.  Legacy PairedBenchmarkReceipt
      remains unowned and fails closed for both contract performance and parallel
      scaling admission subjects.
    - >-
      Root re-reads every admitted new receipt byte, verifies SHA, canonical
      type/version/digest and Runtime-owned reconstruction, checks the source
      snapshot before the record can contribute, and compares every derived
      dynamic field against exactly one parallel_scaling_samples record.  Missing,
      duplicate, substituted, wrong-subject, wrong-producer, same-cardinality,
      or post-admission byte-mutated records fail closed.
    - >-
      R3 ContractPerformanceEvidenceReceipt and R4 typed raw-pair producer keep
      their existing behavior.  This task must not weaken their source/R2
      cross-binding, modify the frozen producer/provenance registry, or regard a
      locally reconstructed receipt as artifact provenance.
    - >-
      Diagnostic refs remain permanently diagnostic-only; missing exact typed
      context is fail-closed/not_evaluated.  No candidate becomes confirmed,
      bug_claimed remains false, and no fixture publishes or authorizes a gate.
    - >-
      No typed parallel producer, raw artifact/provenance admission, 1000-pair
      cohort, 100000 corpus, bootstrap, metric reduction, gate-spec change,
      Contract pass, combined suite, Phase 7, 2h pilot, or 24h run is authorized.
  required_tests:
    负向复核:
      - >-
        Reject each changed source/workload/config/task-set/result/evidence/raw
        counter/clock/timestamp/worker-count field, unequal task counts/sets,
        duplicate identities, zero/non-integer/negative counters, malformed
        digest, wrong envelope type/version/subject, legacy paired receipt, and
        every dynamic-record or producer-digest substitution before authority.
    独立反例验证:
      - >-
        Construct one canonical private parallel receipt and matching dynamic
        record, mutate exactly one binding at a time, and assert the first Root
        exact binding failure.  Verify a same-cardinality substitute and a
        source rebound cannot bind to the original record or make a bundle
        publishable.
    异常输入验证:
      - >-
        Reject missing/extra payload fields, unknown schemas, unreadable or
        byte-modified admissions, invalid canonical forms, caller-supplied
        elapsed/efficiency claims, and invalid runtime subject IDs without a
        throw escaping, candidate confirmation, bug claim, publication, or
        authorization.
  scoped_validation:
