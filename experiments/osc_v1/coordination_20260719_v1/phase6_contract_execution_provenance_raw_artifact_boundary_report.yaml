seam_crosswalk:
  source_snapshot:
    owner: src/datadiff_osc/_phase6_gate_authority.py
    symbols:
      - source_snapshot_payload
      - verify_source_snapshot
      - VerifiedSourceSnapshot
    observation: >-
      The existing snapshot can bind discovered executable source files, public
      freeze, dependency lock, protocol, Git HEAD and a deterministic Git-status
      digest. It becomes invalid on any bound-byte or status change. No snapshot
      was captured here, and a later producer must take one before—not after—the
      measured process and prove it still verifies after that process returns.
  typed_execution_and_r7_proof:
    owner: src/datadiff_osc/_phase6_gate_authority.py
    symbols:
      - _verify_typed_admission
      - _verify_parallel_scaling_provenance_binding
      - verify_artifact_receipt_index
    observation: >-
      Generic Runtime admissions remain rejected as root provenance pending.
      The sole R7 exception re-reads ParallelScalingProductionProvenance and
      exact-pairs it to one ParallelScalingEvidenceReceipt. It has no process
      transcript, raw-artifact hash, complete producer set, or publication
      authority; it must remain only an input to the later boundary.
  producer_receipts_and_dynamic_plan:
    owner: src/datadiff_osc/_phase6_gate_authority.py
    symbols:
      - VerifiedProducerReceipt.digest
      - VerifiedArtifactReceiptIndex.producer_receipts_digest
      - verify_dynamic_gate_plan
    observation: >-
      Producer receipts are constructed before the dynamic plan, allowing the
      plan to bind their deterministic set digest. The receipt index then binds
      the completed dynamic-plan byte SHA. This permits an acyclic sequence and
      forbids an index or dynamic plan from manufacturing an earlier receipt.
  raw_artifact_transport:
    owner: src/datadiff_osc/runtime/gate_artifacts.py
    symbols:
      - RawMetricSeries
      - VerifiedRawGateArtifact
      - verify_gate_artifact_manifest
    observation: >-
      RawMetricSeries transports canonical record identities and values, and
      the manifest rechecks raw artifact bytes against a separately verified
      authority plan. It does not by itself prove the process that produced
      those bytes.
  artifact_receipt_gap:
    owner: src/datadiff_osc/_phase6_gate_authority.py
    symbols:
      - VerifiedArtifactReceipt.provenance_digest
      - verify_artifact_receipt_index
    observation: >-
      The present receipt-index schema reads provenance_digest as a syntactically
      valid declared digest but does not read, hash, reconstruct, or exact-bind
      an execution transcript to the artifact, typed admission, source snapshot,
      output bytes, and exit status. Therefore it cannot admit real execution
      evidence yet.
  frozen_provenance_core_limit:
    owner: src/datadiff_osc/runtime/_producer_provenance.py
    observation: >-
      The frozen private core already models immutable records, exact policy,
      source views, commands, environments, exits, raw parents and typed
      outputs, but its closed raw typed-output rebuilder registry currently
      supplies only repository_test_replay. It cannot be modified under the
      frozen-path rule and therefore cannot itself reconstruct a
      ParallelScalingEvidenceReceipt or ContractPerformanceEvidenceReceipt.
      A successor must own a separate private replayer rather than relax or
      bypass this closed registry.
  clean_worktree_limit:
    owner: experiments/final_bug_discovery_protocol_v3/TODO.md
    observation: >-
      The protocol permits an exact dirty-worktree snapshot only for a
      non-authoritative engineering run; paper authority requires an isolated
      clean worktree or commit. The present worktree has pre-existing dirty and
      untracked state, so no real authority artifact may be claimed here even
      after future private infrastructure tests pass.
  final_authority_and_manifest:
    owners:
      - src/datadiff_osc/_phase6_gate_authority.py
      - src/datadiff_osc/runtime/gate_artifacts.py
    symbols:
      - build_phase6_gate_authority_bundle
      - publish_phase6_gate_authority_bundle
      - verify_gate_artifact_manifest
    observation: >-
      Root first builds only an unpublished bundle after all prior proof layers
      verify. A later independently hashed authority plan and manifest recheck
      artifact bytes and denominator identities. Neither function supplies the
      missing execution provenance, so neither is authorized by this report.
acyclic_construction_order:
  - order: 1
    action: Freeze the future producer implementation and independently capture a verified source snapshot.
    dependency: no execution output, receipt, plan, artifact, or manifest exists yet.
  - order: 2
    action: Run one authorized bounded real producer and persist its canonical process transcript plus typed output envelope.
    dependency: exact pre-capture source snapshot and implementation hashes.
  - order: 3
    action: Reconstruct a private execution-provenance envelope from transcript, typed output, source, implementation and output bytes.
    dependency: order 2 output only; no dynamic plan or artifact admission.
  - order: 4
    action: Derive Root-verifiable typed producer receipts and exact admission/provenance bindings.
    dependency: order 3 exact proof; no artifact index or authority plan.
  - order: 5
    action: Construct a dynamic plan binding the deterministic producer-receipt-set digest.
    dependency: order 4 receipt set.
  - order: 6
    action: Produce canonical raw artifacts and a receipt index that binds the order-5 dynamic-plan SHA and order-4 receipts.
    dependency: order 5 plan and independently re-readable order-3 execution provenance.
  - order: 7
    action: Build an unpublished Root authority payload from the verified source, plan, receipts and artifacts.
    dependency: orders 1 through 6 all exact and complete.
  - order: 8
    action: Under a separate future authority only, externally hash/publish a manifest and recompute gates.
    dependency: order 7 publishable result; no current authorization.
minimum_future_implementation_surface_not_authorized_by_this_report:
  private_execution_provenance:
    candidate_path: src/datadiff_osc/runtime/_phase6_execution_provenance.py
    responsibility: >-
      Strictly reconstruct one canonical process transcript and typed execution
      output, bind source/implementation/output/artifact bytes and exact exit
      status, and reject absent, nonzero, truncated, swapped, or post-capture
      changed inputs.
  private_raw_artifact_producer:
    candidate_path: src/datadiff_osc/runtime/_phase6_raw_artifact_producer.py
    responsibility: >-
      Serialize canonical raw metric records only from a reconstructed execution
      provenance object; no caller-authored raw values, scalar aggregate, or
      opaque declared provenance can substitute.
  root_admission:
    candidate_path: src/datadiff_osc/_phase6_gate_authority.py
    responsibility: >-
      Require a uniquely sorted execution-provenance binding for every newly
      authorized artifact/admission pair, re-hash and reconstruct it before
      retaining producer evidence, and include its verified compact binding in
      the receipt digest.
  focused_tests:
    candidate_paths:
      - tests/osc/test_runtime_phase6_execution_provenance.py
      - tests/osc/test_runtime_phase6_raw_artifact_producer.py
      - tests/osc/test_phase6_gate_authority_integration.py
    responsibility: >-
      Cover legal re-reading plus source/status/implementation/output/exit/
      artifact/admission mutation before any future real execution is authorized.
  separately_scoped_later:
    - A real execution launcher or artifact storage location, if one is needed, requires its own exact-path contract.
    - A clean isolated worktree/commit is a prerequisite for any later paper-authoritative source snapshot and evidence run.
    - Full producer-set, 100000-decision corpus, 1000-pair cohort, bootstrap, manifest publication, and gate calculation each require later authority.
required_successor_validation:
  负向复核:
    - Swap only source snapshot, typed receipt, raw artifact, producer implementation hash, output hash, or admission ID; Root must reject before retaining evidence.
    - Change Git status or any bound source byte after snapshot capture; re-verification must fail closed before artifact admission.
    - Supply declared-only provenance, a synthetic fixture, a scalar aggregate, an index/manifest self-reference, or a same-cardinality substitute; none may become evidence.
  独立反例验证:
    - Use one legal bounded process record whose exact source, typed output, raw artifact, and exit-zero transcript reconstruct; it remains non-publishable until all later required producers and authority layers exist.
    - Mutate exactly one process output byte, stderr hash, command/allowlisted environment identity, exit status, or artifact byte and demonstrate rejection at the first binding boundary.
  异常输入验证:
    - Reject missing/extra fields, malformed hashes, duplicate or unordered identities, path escape, unreadable/truncated output, nonzero exit, unexpected process type, stale schema, and post-capture worktree change without throwing or publishing.
    - Preserve candidate non-confirmed, bug_claimed=false, diagnostic-only refs, and fail-closed/not_evaluated behavior in every success-shaped and failure fixture.
findings:
  - id: OSC-6-CONTRACT-R8-B1
    severity: blocker
    owner: root
    claim: >-
      Current artifact receipt provenance is an opaque declaration rather than
      a Root-reconstructed execution transcript bound to source, process,
      typed output and raw artifact bytes.
    reproduction: >-
      Read verify_artifact_receipt_index: artifact entries require a
      provenance_digest string, but the verifier does not read a provenance
      path or canonical envelope for it; compare the explicit re-read path in
      _verify_parallel_scaling_provenance_binding.
    violated_invariant: >-
      Real execution requires Root-verified producer provenance and raw artifact
      binding; a digest-only assertion cannot supply it.
    required_test: >-
      A future scoped test must reject a valid-looking artifact/index when only
      its transcript/source/output/exit/artifact binding changes, before any
      producer receipt or authority result retains it.
