required_invariants:
  - >-
    The selected cell and pair must be re-derived from the frozen compiled
    declaration universe. The scoped test may select the existing
    pandas_nullable_bool_reduction declaration family, but runtime code must
    not become a family-specific evaluator or hard-code any denominator,
    target-cell ID, or pair obligation ID.
  - >-
    Admit only a valid R1 ReachabilityExecutionBinding whose canonical Case
    exactly equals the current registration-generated case for its fresh cell
    construction index and whose exact pair order equals the registration
    backend order. Recompute and reject stale, swapped, synthetic, unresolved,
    non-fresh, or otherwise mismatched context before adapter launch.
  - >-
    The only admitted execution shape is one direct serial uncached call to
    datadiff.execution.execute_case with parallel=false, exact freshly
    instantiated adapters from datadiff.backends.make_backend, no supplied
    adapter injection, and deterministic adapter close in all paths.
  - >-
    Bind the exact ordered real adapter identities, canonical raw summary
    payload bytes/digests, canonical normalized-result payload bytes/digests,
    case/context binding digest, and direct execution mode. Require an OK
    result from each endpoint; missing, timeout, error, unsupported,
    malformed, substituted, reordered, non-canonical, or digest-mismatched
    results fail closed.
  - >-
    The ephemeral sample is diagnostic-only: authority_eligible=false,
    gate_credit=false, raw_artifact_admitted=false,
    coverage_event_created=false, candidate_confirmed=false, and
    bug_claimed=false unconditionally. It must not create a CoverageLedger
    event, artifact receipt, provenance receipt, source snapshot, source
    worktree, candidate classification, promotion, or public export.
  - >-
    This one sample neither claims nor contributes observed coverage for
    232/384/502, activation, fresh seed blocks, mutation preservation, lane
    focus, dimensions, search performance, exactness, parallel invariance,
    v3 2200, repository gates, Phase 7, 2h, or 24h.
