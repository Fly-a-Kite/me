required_invariants:
  - >-
    The snapshot source clone must be created once from the committed authority
    source, must be clean and remote-free, and must match the declared 409-path
    and content manifests before and after the external snapshot write.
  - >-
    The snapshot must be built only with source_snapshot_payload and canonical
    JSON, externally byte-hash frozen, then verified against the same clone with
    verify_source_snapshot and zero verification errors.
  - >-
    The local environment audit must bind the snapshot byte SHA and source
    digest, the exact lock SHA, interpreter identity, and all seven installed
    distribution versions. A missing package, lock mismatch, altered snapshot,
    or non-canonical/missing audit is fail closed.
  - >-
    No network access is allowed. Consequently the audit records only local
    installed-versus-lock consistency and expressly leaves public latest-version
    verification and TargetVersionReceipt production pending for a later,
    separately authorized formal execution contract.
  - >-
    The source_freeze root is write-once: it and both named output files must be
    absent immediately before the one command, present exactly once after it,
    and never be overwritten or regenerated.
  - >-
    The reserved formal_evidence root remains absent. No formal evidence or gate
    artifact may be inferred from either precondition file.
negative_review_requirements:
  负向复核:
    - omit one required source path in memory and require source snapshot refusal
    - substitute the snapshot byte SHA and require verification failure
    - require a nonexistent distribution or changed lock binding to fail the audit builder
  独立反例验证:
    - >-
      A clean clone plus matching local package versions has zero formal gate
      credit without public latest-version audit, real execution, or typed receipts.
  异常输入验证:
    - >-
      Dirty or remote source clone, preexisting output, snapshot byte mutation,
      missing package, lock drift, and malformed audit must stop the task.
