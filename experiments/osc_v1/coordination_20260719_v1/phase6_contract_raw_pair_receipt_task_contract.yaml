    - tests/osc/test_runtime_producer_provenance.py
    - src/datadiff_osc/runtime/gates.py
    - src/datadiff_osc/runtime/gate_artifacts.py
    - src/datadiff_osc/contract_engine/_phase6_corpora.py
    - tests/osc/test_contract_phase6_corpora.py
    - tests/osc/test_search_context_receipts.py
    - tests/osc/test_search_gate_crosswalk.py
    - tests/osc/test_search_lane_registry.py
    - docs/**
    - scripts/**
    - experiments/final_bug_discovery_protocol_v3/**
  frozen_interfaces:
    - osc-public-api-freeze-v1:cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
    - osc-pre24-gate-spec-set-d9792996cacb6fc6e47bce602d5f7ab6d6382c62ba9e1ac6bc1f8003ecbec552
    - all thirteen frozen_target_sha256 entries above
  required_invariants:
    - >-
      The new receipt is private, versioned, canonical, and has a derived
      sample identity. It binds the R2 comparison-decision context, source,
      ResultGroup, contract, ordered endpoint set, fingerprint/exact task and
      result identities, partition digests, benchmark/environment/config
      context, baseline/treatment typed-task/result/seed/outcome/evidence
      identifiers, and all three raw paired measurements.
    - >-
      The baseline must be the explicit always-materialize pairwise strategy;
      the treatment must be staged exact escalation. Their configuration,
      task, result, outcome, and evidence identities must be distinct where
      execution identities require it. Every baseline materialized-byte,
      backend-pair-count, and comparison-CPU observation is a positive integer;
      each treatment observation is a non-negative integer. Booleans, floats,
      negative values, non-finite values, missing context, or a caller-provided
      sample ID fail closed.
    - >-
      Root advances only the private dynamic-plan schema to v3 and rejects v1
      and v2 plans. Its contract_performance_samples record is derived from the
      receipt and must match every identity, raw value, and producer digest.
      It must cross-link the pair's comparison-decision context to the already
      R2-bound contract_comparison_decisions record and its contract producer
      receipt before the record can contribute to any denominator.
    - >-
      Runtime owns strict reconstruction and canonical round-trip of the new
      receipt; Root re-reads the admitted bytes, re-hashes them, verifies the
      canonical envelope type/version/digest, calls the Runtime-owned private
      reconstruction helper, and compares each derived field. It must not
      accept a digest-only, same-cardinality, stale, substituted, malformed,
      duplicate, or old-schema receipt.
    - >-
      The legacy PairedBenchmarkReceipt v1 remains private compatibility data
      for its frozen producer and tests but is permanently diagnostic-only for
      this Phase-6 performance authority. It must fail closed as an admission
      for performance_paired_replay; no frozen producer or frozen test changes.
    - >-
      This task creates no 1000-pair cohort, no cohort rank/bootstrap, no
      100000 corpus execution, no raw gate artifact, no gate-spec change, no
      metric reduction, and no performance or contract pass. A later separately
      authorized contract is required for a real producer, complete cohort,
      artifacts, bootstrap calculation, and gate decision.
    - >-
      Diagnostic refs remain permanently diagnostic-only. Missing exact typed
      context is fail-closed/not_evaluated; candidates remain non-confirmed and
      bug_claimed=false in every fixture and execution-shaped input.
  required_tests:
    负向复核:
      - >-
        Reject individually changed comparison/source/task/result/partition,
        benchmark/config, seed/outcome/evidence, raw counter, producer digest,
        canonical envelope byte, type, version, digest, and dynamic-record
        fields before any publication or denominator authority.
      - >-
        Show legacy PairedBenchmarkReceipt v1, dynamic-plan v1/v2, duplicate
        sample IDs, duplicate comparison decisions, missing/extra fields, and
        same-cardinality substituted records fail closed.
    独立反例验证:
      - >-
        Construct one canonical raw-pair receipt and one exact R2 comparison
        record, then mutate precisely one binding at a time. Assert the first
        exact Root binding failure and that neither a bundle nor a gate can
        become publishable.
    异常输入验证:
      - >-
        Reject zero/non-integer baseline counters, negative or boolean
        treatment counters, non-finite payload forms, same task/result/config,
        invalid strategy labels, malformed digests, unsupported schemas,
        unresolved comparison references, and unreadable admissions without
        throwing, confirmation, bug claim, publication, or authorization.
  scoped_validation:
    command: >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      tests/osc/test_runtime_phase6_contract_performance_receipts.py
      tests/osc/test_runtime_semantic_replay.py
      tests/osc/test_phase6_gate_authority_integration.py
    timing: exactly once, only after all allowed implementation writes and SHA checks
    forbidden_substitutes:
      - tests/osc
      - repository suite
      - six-file combined suite
      - 100000 parity execution
      - v3 2200
      - Phase 7
      - 2h pilot
      - 24h run
  completion_requirements:
    - reverify every allowed product path and all thirteen frozen/public SHA values before the scoped suite
    - retain the exact command, exit code, and complete terminal result in the report
    - reverify every allowed product path and all thirteen frozen/public SHA values after the scoped suite
    - use apply_patch for the report and ledger only after the real terminal result is known
    - retain phase_6_contract as pending regardless of scoped-suite outcome
  stop_conditions:
    - any frozen/public SHA mismatch, staged user path, pre-existing target path, or scope expansion
    - any need to modify a public export, legacy private receipt, frozen producer/test, gate spec, raw metric reducer, docs, or script
    - any accepted legacy performance receipt, unbound pair, caller-authored sample ID, source rebind, duplicate/substituted record, publishable bundle, gate pass, candidate confirmation, or bug_claimed=true
    - failed scoped suite or incomplete terminal test evidence
