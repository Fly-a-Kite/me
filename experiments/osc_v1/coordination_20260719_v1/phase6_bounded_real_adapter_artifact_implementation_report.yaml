    severity: medium
    claim: >-
      The sole allowed scoped suite failed because its negative test expected
      the duplicate-JSON error after it had already mutated the artifact bytes
      without updating expected_sha256. The verifier correctly reports the
      earlier bounded artifact SHA mismatch; the duplicate-field failure is not
      completely validated by a passing suite.
    reproduction: >-
      Mutate master_seed in the serialized file and retain the original expected
      SHA. verify_bounded_real_adapter_artifact raises bounded artifact SHA
      mismatch before JSON parsing, while the test asserts duplicate JSON fields.
    violated_invariant: >-
      Each required negative path must have a complete, correctly ordered,
      passing fail-closed assertion; an earlier integrity failure cannot be
      misrepresented as validation of a later parser failure.
    required_test: >-
      Under a new test-only remediation contract, assert SHA mismatch for the
      byte mutation, then create a duplicate-key payload with its matching
      expected SHA and assert duplicate JSON fields. Run the new contract's
      scoped suite exactly once.
