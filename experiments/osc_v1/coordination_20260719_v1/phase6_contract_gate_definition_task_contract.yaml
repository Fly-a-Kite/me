    - any need to alter public exports, public_api_freeze.json, or a frozen target
    - any ambiguous denominator, unbound raw pair, self-authored pass claim, or threshold change
    - any request to execute 100000 parity, v3 2200, tests/osc, repository tests, Phase 7, 2h, or 24h
    - any need to create a child agent or to modify a product path without a successor implementation contract
  completion_report:
