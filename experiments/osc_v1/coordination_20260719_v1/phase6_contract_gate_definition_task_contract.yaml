    - osc-pre24-gate-spec-set-d9792996cacb6fc6e47bce602d5f7ab6d6382c62ba9e1ac6bc1f8003ecbec552
    - all thirteen frozen_target_sha256 entries above
  required_invariants:
    - >-
      This definition task does not edit the 41-spec set, an authority schema,
      any producer, public API/export, corpus foundation, or test. A successor
      implementation task contract is required before each such edit.
    - >-
      Every gate denominator is a complete exact typed identity set. Cardinality
      alone, caller-authored IDs, aggregate scalars, a sample relabeled as a full
      audit, or a missing zero-valued series is not evidence.
    - >-
      The Phase-6 full canonical comparison corpus is exactly 100000 uniquely
      identified normalized ResultGroup comparison decisions. Each decision must
      bind result_group_digest, canonical ordered endpoint_set_digest,
      contract_fingerprint_digest, source_case_digest, source snapshot digest,
      canonical-comparison algorithm identity, fingerprint task/result identity,
      and exact-comparator task/result identity. Its frozen identity digest is
      supplied by a Root authority plan; an incomplete, duplicate, substituted,
      unresolved, or non-typed record fails closed.
    - >-
      `contract.fingerprint_full_canonical_equivalence` requires all 100000 full
      corpus decisions to have a fingerprint equality decision recomputed from
      raw fingerprint objects and the same full-canonical equality decision
      recomputed from raw canonical objects. The two booleans must agree for
      every exact identity; self-declared verdicts do not count.
    - >-
      `contract.mismatch_full_diff_escalation` uses the exact subset of full
      corpus decision IDs for which the recomputed fingerprint equality decision
      is false. Every member must have one separately typed full-diff execution
      bound to the same decision; no mismatch may be dropped, duplicated,
      substituted, or discharged by a scalar. An empty mismatch subset is
      admissible only after the complete 100000 full corpus is independently
      verified.
    - >-
      `contract.equal_fingerprint_full_audit_deviations` audits every exact full
      corpus decision whose recomputed fingerprint equality decision is true,
      not a sample. Each must have a bound full-canonical comparison and the
      deviation set (fingerprint equal but canonical unequal) must be exactly
      empty. Empty, incomplete, duplicate, or forged equal-fingerprint subsets
      fail closed rather than passing vacuously.
    - >-
      `contract.backend_clustering_pairwise_equivalence` requires a complete
      full-corpus comparison of the planner's canonical backend-cluster partition
      with an explicit pairwise-canonical-comparison partition under the same
      ordered endpoint set and contract identity. All 100000 partitions must be
      exactly equivalent; a fingerprint collision cannot be used as evidence of
      equivalence.
    - >-
      The paired performance cohort is exactly 1000 distinct eligible decisions
      selected without replacement from the frozen 100000 corpus by ascending
      SHA-256 rank of the domain-separated tuple
      (`osc-phase6-contract-performance-cohort-v1`, comparison_decision_id).
      Eligibility is frozen before measurement: at least two endpoints and an
      always-materialize pairwise baseline is planned. Fewer than 1000 eligible
      decisions, changed rank rule, duplicate/missing IDs, or any post-hoc
      selection fails closed.
    - >-
      Each paired performance observation has one cohort decision ID and exactly
      two distinct typed task/result bindings: baseline is always-materialize
      explicit pairwise comparison and treatment is the staged planner with
      exact escalation. Both bind the same result group, ordered endpoint set,
      contract fingerprint, source case, source snapshot, backend/version/mode/
      layout context, semantic comparator identity, resource envelope, and
      verdict. Raw non-negative finite baseline/treatment materialized bytes,
      backend-pair comparison counts, and comparison CPU nanoseconds are stored
      per pair; aggregates or diagnostics alone cannot serve as raw observations.
    - >-
      For `contract.comparison_cpu_reduction`, the exact cohort aggregate is
      `1 - sum(treatment_cpu_ns) / sum(baseline_cpu_ns)` and must be at least
      0.30. A non-positive baseline aggregate or any absent/misbound raw pair
      fails closed.
    - >-
      For both `contract.materialized_bytes_reduction` and
      `contract.backend_pair_comparison_reduction`, the exact cohort aggregate
      `1 - sum(treatment) / sum(baseline)` must be at least 0.30, and the
      deterministic paired bootstrap 95 percent lower confidence bound of that
      same reduction must be strictly greater than zero. The bootstrap uses the
      1000 pairs sorted by comparison_decision_id, 10000 resamples of 1000 pairs
      with replacement, seed `int(sha256(canonical_json({schema_version,
      source_digest, cohort_identity_digest, metric_key})), 16)`, and the
      nearest-rank 2.5th percentile at index 249. Each baseline observation must
      be strictly positive for the relevant metric; otherwise the metric is
      not_evaluated and fails closed. This is an explicit user-authorized
      definition of the formerly qualitative word `significant`, not a pass.
    - >-
      All paired comparisons preserve the authority verdict: baseline and
      treatment exact verdicts must agree for every performance-cohort identity;
      an approximate or pruned result cannot substitute for the required exact
      comparator. Missing exact typed context is fail closed/not_evaluated.
    - >-
      Diagnostic refs remain permanently diagnostic-only. No definition,
      producer, metric, evaluation, or report may change candidate to confirmed,
      set bug_claimed=true, authorize a gate pass, Phase 7, a 2h pilot, or a 24h
      run.
  deliverables:
