  private_typed_raw_pair_producer:
    path: src/datadiff_osc/runtime/_phase6_contract_performance_producers.py
    pre_sha256: absent
    post_sha256: 417f5552a040f74b884bedb23838f27684e0868ff59819c32735fd408f1b0d5b
    result: >-
      Added a private pure builder for one existing R3
      ContractPerformanceEvidenceReceipt.  It derives source/comparison,
      partition, benchmark/environment, arm configuration, typed task/result/
      seed/outcome/evidence, and raw counter fields from a real R1 comparison
      receipt and exact typed Runtime objects.  It rejects non-OK, non-exact,
      misbound, duplicate, candidate-shaped, or invalid-counter input before a
      receipt exists.  The sole R2 producer digest is carried as an opaque value
      for R3 Root's existing later cross-object check; this module does not treat
      it as provenance.
  tests:
    path: tests/osc/test_runtime_phase6_contract_performance_producers.py
    pre_sha256: absent
    post_sha256: 187b7c4238c68e24766928eac9b1b0bb7c6591db8166edaecfe1450f8338ec58
    result: >-
      Added typed legal construction plus negative, independent-counterexample,
      and exceptional-input coverage for result-group/case/seed/protocol/resource,
      task/result/outcome/evidence/verdict/state, raw counters, context ordering,
      strategy spoofing, source rebind identity, and no-public-authority behavior.
