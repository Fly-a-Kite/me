global_requirements:
  - >-
    Each reviewer reads its required inputs to EOF before semantic validation,
    verifies every assigned target SHA before the one permitted scoped pytest
    command and again after it, and stops on any mismatch.
  - >-
    Each reviewer performs only read-only 负向复核、独立反例验证、异常输入验证;
    writes=0, child_agents=0, forbidden_paths_modified=[], and deviations=[]
    are mandatory.
  - >-
    Every Python command uses PYTHONDONTWRITEBYTECODE=1. Each reviewer executes
    only its assigned scoped pytest command exactly once; no tests/osc directory
    suite, repository suite, parity-100000, v3-2200, Phase 7, 2h, or 24h execution.
  - >-
    Public exports, public_api_freeze.json, all frozen targets, thresholds,
    denominators, comparator semantics, replay authority, provenance origin,
    admission authority, and execution authorization are immutable.
  - >-
    Diagnostic refs remain permanently diagnostic-only; missing exact typed context
    fails closed or is not_evaluated; a candidate remains non-confirmed and
    bug_claimed=false.
  - >-
    Findings are correctness, soundness, reproducibility, authority-boundary, or
    missing-negative-test findings only. Every finding supplies id, severity, claim,
    reproduction, violated invariant, and required test. Root aggregation is not
    an independent reviewer report.
