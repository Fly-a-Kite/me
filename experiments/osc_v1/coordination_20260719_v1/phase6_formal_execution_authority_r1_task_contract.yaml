formal_execution_admission:
  common_preconditions_before_any_formal_execution:
    - >-
      A successor authority must create and verify a fresh clean-source snapshot
      for this exact source commit, including source digest, required path hashes,
      clean Git status, no remote, interpreter/dependency lock, and latest target
      package audit. The current dirty user worktree is never paper authority.
    - >-
      A successor authority must reserve empty, non-overwritable external output
      roots; predeclare artifact/index/plan/report locations, canonical schemas,
      seed exclusions, concurrency, resource limits, stop conditions, and exact
      commands before it starts real work.
    - >-
      Any product implementation needed to emit formal evidence requires its own
      narrow task contract, frozen-interface review, scoped tests, and a new clean
      source snapshot before formal execution. No existing private diagnostic
      artifact may be transformed into formal evidence.
  contract_receipt_stream:
    required_real_evidence:
      - 9_of_9_confirmed_root_exact_recall
      - approved_false_positive_precision_fixes_100_percent
      - high_risk_comparator_axis_hyperedge_mutants_100_percent_killed
      - 100000_exact_vs_staged_result_groups_zero_verdict_discrepancy
      - compile_match_p95_within_protocol_limit
      - paired_throughput_regression_within_10_percent
      - at_least_1000_real_distinct_contract_performance_pairs
    receipt_index_requirements:
      producer_kinds_exactly:
        - contract_exact_replay
        - coverage_admission_replay
        - reachability_admission_replay
        - focus_admission_replay
        - parallel_authority_replay
        - v3_typed_run_replay
        - repository_test_replay
        - target_version_replay
        - candidate_classification_replay
        - performance_paired_replay
      binding_requirement: >-
        Every producer receipt and raw artifact must use allowed typed envelopes,
        exact source/task/result/seed/outcome/artifact bindings, canonical bytes,
        no synthetic marker, one distinct producer kind, and an index that fails
        closed for missing/duplicate/extra kinds or digest mismatch.
  granularity_reachability_stream:
    required_real_evidence:
      - declaration_compiler_recomputes_16_fresh_families_232_cells_384_edges_502_obligations
      - deterministic_construction_activation_232_of_232
      - deterministic_contrast_activation_384_of_384_edges_both_endpoints
      - fresh_seed_reachability_232_cells_at_least_twice_16_families_two_seed_blocks
      - contrast_observation_384_of_384
      - all_502_backend_obligations_executed_or_frozen_unsupported_evidence
      - scheduled_activation_overall_at_least_95_percent_and_each_family_at_least_90_percent
      - target_preserving_mutation_overall_at_least_90_percent_and_each_family_at_least_80_percent
      - eleven_lanes_focus_signal_at_least_five_each_and_lane_hit_rate_at_least_80_percent
      - 21_operations_21_expressions_8_aggregates_7_risk_classes_18_pipelines_observed
  runtime_correctness_stream:
    required_real_evidence:
      - worker_1_vs_n_task_set_seed_lineage_and_authority_verdict_exactly_equal
      - every_approximation_or_pruning_path_has_exact_escalation_and_fault_injection_detection
      - v3_22_of_22_runs_2200_of_2200_cases_actually_executed
      - v3_zero_iteration_failures_zero_pipeline_errors_zero_non_ok_backend_results
      - every_candidate_campaign_3_of_3_and_candidate_pipeline_3_of_3_rechecks
      - complete_repository_suite_zero_failures
      - latest_target_audit_matches_frozen_versions
  final_assembly:
    - >-
      Only after all three streams are complete may Root build the exact
      18-section dynamic plan, then the complete receipt index, then a verified
      gate bundle/report. Plan/index identities and every per-record producer
      receipt digest must cross-bind exactly; any omitted result remains pending.
required_invariants:
  - >-
    This authority never mistakes a plan, placeholder, private diagnostic,
    declared digest, or syntactic JSON shell for executed evidence. Missing exact
    typed context is fail-closed/not_evaluated.
  - >-
    All formal outputs must derive from the future clean-source snapshot and
    actual bounded commands. No output may overwrite an existing path or include
    synthetic/caller-authored aggregate evidence.
  - >-
    Candidate remains non-confirmed and bug_claimed=false throughout Phase 6;
    diagnostic references remain diagnostic-only permanently.
  - >-
    The private foundation barrier remains pass_unchanged, but the three formal
    Phase-6 gates remain pending until actual independent evidence and final
    verification exist.
negative_review_requirements:
  负向复核:
    - >-
      Verify that one private artifact, an incomplete producer set, a missing
      source snapshot, or a plan shell cannot enter a formal receipt index or
      gate report.
  独立反例验证:
    - >-
      Verify that the clean isolated clone alone has no formal-gate credit before
      real execution, even though its source commit and frozen targets are exact.
  异常输入验证:
    - >-
      Record that source drift, dependency/version drift, nonempty output roots,
      malformed or synthetic artifacts, duplicate producer kinds, failed scoped
      tests, or incomplete terminal evidence stop the future program.
