required_invariants:
  - >-
    Bind one ScheduledTargetAttemptReceipt, CanonicalCaseBinding, construction
    outcome, extracted atoms, activation certificate, selected fresh backend-pair
    obligation, materialized HyperContract, endpoint tuple, applicability
    certificate, typed Runtime results, EvidenceEnvelope values, and
    ObservationCertificate exactly and fail closed on any substitution.
  - >-
    The formal plan/case/run/block/assignment/cell/family identities and all
    opaque observation-context refs must be recomputed as exact runtime task,
    outcome, activation, and observation identities; no caller string may earn
    context credit by itself.
  - >-
    Require real typed object invariants before any verdict branch: source Case
    bytes/extraction/activation, contract materialization, endpoint order,
    applicability binding, task/result-group/seed/outcome/evidence binding, and
    exact escalation for a VIOLATED observation.
  - >-
    Reject non-OK outcomes, INAPPLICABLE or INCONCLUSIVE observation, stale or
    swapped task/result/evidence references, wrong seed stage, wrong pair,
    malformed or unresolved construction, and any independently-confirmed
    evidence state.
  - >-
    The private binding must expose authority_eligible=false and gate_credit=false
    unconditionally. It creates no CoverageLedger event, no artifact receipt,
    no producer provenance claim, no candidate promotion, and bug_claimed remains
    false.
  - >-
    The scope is one cell/pair context only. It does not claim 232/384/502,
    scheduled activation, mutation preservation, focus, dimensions, performance,
    real-adapter execution, raw artifacts, or Phase-6 gate completion.
negative_review_requirements:
  负向复核:
    - planned-case, lane/run/block, cell/family, assignment, pair, contract, endpoint, and ref substitution
    - non-OK outcome and INAPPLICABLE/INCONCLUSIVE/unelevated-VIOLATED observation rejection
  独立反例验证:
    - task/result-group/seed/outcome/evidence swaps must fail before a verdict can mask them
    - opaque-ref-only contexts and caller-confirmed evidence must not become admissible
  异常输入验证:
