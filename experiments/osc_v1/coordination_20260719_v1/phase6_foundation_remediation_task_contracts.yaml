schema_version: osc-task-contract-v1
phase: 6
round: private_foundation_remediation_r1
mode: three_parallel_disjoint_bounded_writes
entry_review:
  path: experiments/osc_v1/coordination_20260719_v1/phase6_foundation_ring_review_reports.yaml
  sha256: e60565932153ec3eda397903e01e675ac60a11ff48e10c232801b9ccc8eeee38
  aggregate_counts: {blocker: 2, high: 12, medium: 2, low: 0}
coordination:
  direct_agent_count: 3
  grandchildren_allowed: false
  root_owns_shared_integration: true
  preserve_dirty_worktree: true
  exact_allowlists_are_exclusive: true
global_forbidden_paths:
  - src/datadiff_osc/__init__.py
  - src/datadiff_osc/api.py
  - src/datadiff_osc/runtime/__init__.py
  - src/datadiff_osc/public_api_freeze.json
  - src/datadiff_osc/_phase6_gate_authority.py
  - src/datadiff_osc/_replay_support.py
  - src/datadiff_osc/contract_engine/replay.py
  - src/datadiff_osc/search/semantic_replay.py
  - src/datadiff_osc/runtime/_semantic_replay.py
  - src/datadiff_osc/runtime/gates.py
  - src/datadiff/strategy_registry.py
  - experiments/canonical_confirmed_bug_corpus/**
global_requirements:
  - remediate every assigned blocker, high and medium finding with a negative regression
  - all new or changed types remain private and unexported; public_api_freeze.json remains byte-identical
  - increment private schema versions whenever accepted serialized meaning or required fields change
  - exact typed reconstruction and constructor invariants are mandatory; strings and caller summaries are not evidence
  - missing exact context remains context-required, not_evaluated, MISSING_INPUT or rejected and never becomes authority
  - no corpus approval, coverage, evidence, candidate, confirmed bug, gate, Phase 7 or 24h authority is created
  - opaque diagnostic refs remain diagnostic-only and are not read by these changes
  - candidate is never promoted to confirmed bug and bug_claimed remains false
  - use PYTHONDONTWRITEBYTECODE=1 for every Python command
  - run only each task's bounded scoped tests; tests/osc, full repository, parity 100000 and v3 2200 remain locked
  - preserve all unrelated tracked and untracked user changes
tasks:
  - task_id: OSC-6-FOUNDATION-REMEDIATE-CONTRACT-R1
    owner: /root/phase5_authority_audit
    change_request: CR-OSC-6-002
    findings: [OSC-6-C-H1, OSC-6-C-H2, OSC-6-C-H3, OSC-6-C-H4, OSC-6-C-H5, OSC-6-C-M1]
    allowed_write_paths:
      - src/datadiff_osc/contract_engine/_phase6_corpora.py
      - tests/osc/test_contract_phase6_corpora.py
    forbidden_write_paths:
      - all_paths_except_allowed_write_paths
    requirements:
      - >-
        Distinguish STRUCTURALLY_REVIEWED_CONTEXT_PENDING from trusted independent
        approval. Arbitrary reviewer identities never set independently_approved
        and never meet an approved minimum; without a Root-provided trusted
        approval context this foundation must remain context-pending.
      - >-
        Every confirmed-root entry binds the frozen VIOLATED verdict and a
        recomputable expected-signature digest; exact IDs and source SHAs alone
        cannot validate a substituted verdict or signature.
      - >-
        Replace the generic false-positive shell with a specialized typed
        adjudication binding finding/component identity, observed and adjudicated
        verdicts, adjudication source path/SHA, component rule/diff, and explicit
        empty globally_ignored_axes and globally_ignored_families.
      - >-
        Replace the generic compatibility shell with a specialized exact v1/v2
        pair over the same case, endpoint set and contract fingerprint, with
        exact task/result identities and both verdicts preserved.
      - >-
        Replace source-only mutant material with a specialized typed witness
        binding baseline and mutant TaskSpec/result/outcome identities, case,
        contract fingerprint, endpoint set, mutant ID/version/source and a
        category-specific kill predicate. Cross-mutant swaps and duplicated
        pairs fail closed.
      - generic or source-only false-positive, compatibility and mutant shells remain MISSING_INPUT or rejected
      - reject NUL and every C0 control character at path construction/decode; Path.resolve errors become structured rejection
    required_tests:
      - arbitrary reviewer IDs are structural-only and minimum one remains false
      - all nine confirmed verdict substitutions and signature substitutions reject
      - incomplete, globally suppressing or source-only false-positive evidence rejects
      - incomplete or cross-context v1/v2 pairs reject; exact typed pair round-trips
      - all source-only mutants reject; valid typed category witnesses round-trip and cross-mutant swaps reject
      - NUL/C0, traversal, alias and resolver failures reject deterministically
      - prior positive source/SHA, duplicate-JSON, pending-root and authority-negative tests remain green

  - task_id: OSC-6-FOUNDATION-REMEDIATE-SEARCH-R1
    owner: /root/phase5_consumer_audit
    change_request: CR-OSC-6-003A
    findings: [OSC-6-FOUNDATION-SEARCH-H1, OSC-6-FOUNDATION-SEARCH-H2, OSC-6-FOUNDATION-SEARCH-H3, OSC-6-FOUNDATION-SEARCH-H4, OSC-6-FOUNDATION-SEARCH-M1]
    allowed_write_paths:
      - src/datadiff_osc/search/lane_registry.py
      - src/datadiff_osc/search/context_receipts.py
      - src/datadiff_osc/search/context_replay.py
      - tests/osc/test_search_lane_registry.py
      - tests/osc/test_search_context_receipts.py
      - tests/osc/test_search_gate_crosswalk.py
    forbidden_write_paths:
      - all_paths_except_allowed_write_paths
    requirements:
      - reject duplicate planned cases, seed blocks, Runtime task/outcome refs and focus evidence before canonical ordering; never normalize with set
      - >-
        Add a private exact formal-run binding that maps every case to one run,
        seed block, master seed and SeedLineage; recompute protocol, lane, stage,
        case index, counter and parent relationships and reject cross-run replay.
      - >-
        Mutation attempts bind the source case, derived MUTATION lineage and
        mutation seed, registered operator identity, immutable typed
        MutationOutcome and ActivationCertificate assignment digest. Rejected
        mutations cannot earn preservation credit and cross-attempt swaps reject.
      - >-
        Intrinsic focus evidence is built from typed source-specific payloads and
        rule identity and must recompute the obligation signal. Arbitrary digest
        strings, metadata relabeling, wrong case and source swaps reject.
      - Runtime observation evidence remains context-required and cannot become Search, Root or gate authority
      - preserve the exact 11 lanes, 37 lane-signal obligations, 20 signals and legacy default count 9
    required_tests:
      - every duplicate class rejects and canonical unique inputs remain deterministic
      - wrong run, block, seed, lineage stage, parent, counter or case mapping rejects; valid typed mappings round-trip
      - mutation wrong seed, lineage, outcome, certificate or attempt binding rejects; valid typed attempt round-trips
      - relabeled digest and signal-mismatching focus inputs reject; valid typed source proof round-trips
      - all context-required/admitted-false and registry exactness tests remain green

  - task_id: OSC-6-FOUNDATION-REMEDIATE-RUNTIME-R1
    owner: /root/phase5_evidence_audit
    change_request: CR-OSC-6-004
    findings: [OSC-6-FOUNDATION-RUNTIME-B1, OSC-6-FOUNDATION-RUNTIME-B2, OSC-6-FOUNDATION-RUNTIME-H1, OSC-6-FOUNDATION-RUNTIME-H2, OSC-6-FOUNDATION-RUNTIME-H3]
    allowed_write_paths:
      - src/datadiff_osc/runtime/_producer_provenance.py
      - src/datadiff_osc/runtime/_receipt_producers.py
      - tests/osc/test_runtime_producer_provenance.py
      - tests/osc/test_runtime_receipt_producers.py
    forbidden_write_paths:
      - all_paths_except_allowed_write_paths
    requirements:
      - >-
        Bind an exact expected provenance policy for each record: category,
        record ID, subject, canonical path, schema and allowed origin. Frozen
        control/public origins require independently supplied exact source SHAs;
        record relabeling cannot escape policy.
      - >-
        Canonically decode every typed output, enforce declared type/version,
        reconstruct its real typed object, rerun semantic invariants, recompute
        subject identity, and bind raw parent record IDs. Unknown, incomplete or
        structured-failure material fails closed.
      - >-
        Paired measurements accept typed raw monotonic timestamps and counters
        only. Baseline/treatment bind the same case, result group, contract,
        endpoint set, seed lineage and protocol, plus full TaskSpec digests and
        exact task/result/outcome identities; non-OK outcomes reject.
      - >-
        Candidate stage receipts enforce state-specific reproduction thresholds,
        typed case/result/evidence binding and disjoint campaign/pipeline tasks
        and results. STABLE_SURVIVOR cannot be emitted from failed reproduction.
      - >-
        Target-version receipts strictly parse installed distribution metadata
        and frozen public response bytes and derive names/versions; caller scalar
        conflict rejects.
      - >-
        Repository-test receipts strictly parse JUnit bytes and derive collection,
        node IDs and outcomes; exit/log/JUnit/caller-summary conflict rejects.
      - do not connect producers to legacy execution, semantic replay, Root authority or any launcher
    required_tests:
      - category, subject, path, schema, origin and frozen-source relabel attacks reject
      - malformed/wrong-version/wrong-subject typed bytes and raw-parent swaps reject; exact typed replay round-trips
      - paired seed/context/task/result swaps, caller scalar spoofing and non-OK outcomes reject
      - zero/insufficient reproduction and cross-stage reuse reject; valid disjoint typed stages round-trip
      - installed/latest raw-scalar conflicts and malformed metadata reject
      - failing JUnit/log cannot produce a passing repository receipt; exact passing JUnit round-trips
      - all existing provenance and producer negative tests remain green
round_exit:
  - every owner reports exact changed paths, before/after SHA and scoped test command/result
  - Root verifies all writes remain inside the three disjoint allowlists
  - Root reproduces every original counterexample and runs the combined 58-plus-remediation scoped suite
  - a new rotated exact-SHA read-only ring review must report blocker=0, high=0 and medium=0
  - only Root may write the foundation barrier or authorize later Phase-6 integration
execution_authorization:
  scoped_tests_only: true
  tests_osc: false
  full_repository_tests: false
  parity_100000: false
  v3_2200: false
  phase7_pilot_2h: false
  twenty_four_hour: false
