    - R3 ContractPerformanceEvidenceReceipt v1
    - R4 ContractPerformanceProductionObservation private construction contract
    - R7 ParallelScalingProductionProvenance private proof
  required_invariants:
    - >-
      The new Runtime module is private and adds no public export. It owns a
      complete canonical ContractPerformanceProductionObservation, its exact
      R4-derived receipt, and locally derived hashes of the R4 producer and
      bridge modules. Reconstruction must use the Contract-owned exact
      comparison receipt replayer and Runtime typed result/task/seed/outcome/
      evidence replayers, re-run every R4 invariant, rebuild the receipt, and
      exact-round-trip the canonical payload. No caller-provided receipt,
      sample, source, task/result, evidence, raw counter, context, or digest
      substitutes for this rebuild.
    - >-
      Root may make a provisional exception to generic Runtime provenance
      rejection only for ContractPerformanceEvidenceReceipt under
      performance_paired_replay when a separately declared uniquely sorted
      contract_performance_provenance binding exists for that exact admission.
      Root must re-hash/re-read the proof, reconstruct it, compare the
      re-derived receipt with the admitted receipt, bind source/sample/receipt
      and implementation hashes, and include a compact verified proof in the
      producer receipt digest. Missing, duplicate, malformed, stale, swapped,
      extra, wrong-path, wrong-schema, wrong-source, or wrong-admission proof
      removes the contract-performance admission.
    - >-
      The R7 parallel proof remains unchanged. Contract and parallel proof
      lists are type-specific, independently bijective, and cannot satisfy
      each other. A receipt that has neither exact proof remains rejected;
      every other Runtime type and direct helper call stays fail closed.
    - >-
      A legal test fixture is an incomplete, invalid, non-publishable receipt
      index. This task creates no actual source snapshot, process transcript,
      raw artifact, complete producer set, 100000 corpus, 1000-pair cohort,
      bootstrap, metric result, authority bundle, manifest, or gate evidence.
    - >-
      Diagnostic refs remain permanently diagnostic-only. Missing exact typed
      context is fail-closed/not_evaluated; candidate remains non-confirmed,
      bug_claimed remains false, and no public/gate/Phase-7/2h/24h authority
      is created.
  required_tests:
    负向复核:
      - >-
        Mutate exactly one comparison/source/result-group/endpoint/task/result/
        seed/outcome/evidence/benchmark/config/counter/receipt/implementation
        field and assert reconstruction or Root pairing rejects it before the
        admission is retained.
      - >-
        Demonstrate absent/duplicate/swap/extra proof, post-admission proof or
        receipt byte mutation, source rebind, same-cardinality substitution,
        wrong proof type/schema/path, and a parallel proof offered for a
        contract receipt all fail closed.
    独立反例验证:
      - >-
        Build one legal R4 observation and canonical proof, bind it to one
        otherwise incomplete private index, and verify only the exact contract
        admission is retained while the index remains invalid and
        non-publishable.
      - >-
        Change one valid source or raw-counter observation and show it derives
        a different receipt/proof identity which cannot bind the original.
    异常输入验证:
      - >-
        Reject missing/extra fields, malformed implementation hash, wrong
        object, invalid canonical envelope, unordered/duplicate proof list,
        unsupported legacy PairedBenchmarkReceipt, path escape and unreadable
        equivalent hash mismatch without exception, publication, confirmation,
        or bug claim.
  scoped_validation:
    command: >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      tests/osc/test_runtime_phase6_contract_performance_provenance.py
      tests/osc/test_runtime_phase6_contract_performance_producers.py
      tests/osc/test_runtime_phase6_contract_performance_receipts.py
      tests/osc/test_phase6_gate_authority_integration.py
    timing: exactly once, only after all allowed implementation writes and SHA checks
    forbidden_substitutes:
      - tests/osc
      - repository suite
      - six-file combined suite
      - 100000 parity execution
      - v3 2200
      - Phase 7
      - 2h pilot
      - 24h run
  completion_requirements:
    - reverify all allowed product paths, R3/R4/R7 immutable inputs, and all thirteen frozen/public SHA values before the scoped suite
    - retain exact command, exit code, and complete terminal result in the report
    - reverify all allowed product paths and all thirteen frozen/public SHA values after the scoped suite
    - use apply_patch for report and ledger only after the terminal result is known
    - retain phase_6_contract as pending regardless of scoped-suite outcome
  stop_conditions:
    - any frozen/public SHA mismatch, staged user path, pre-existing new path, or scope expansion
    - any need to modify public export, frozen producer/provenance/test, R3/R4 receipt/producer, semantic replay, gate artifacts/spec, docs, or script
    - any accepted unpaired/mispaired Runtime receipt, caller-authored proof identity, proof cross-type substitution, raw artifact/gate pass, candidate confirmation, or bug_claimed=true
    - failed scoped suite or incomplete terminal test evidence
