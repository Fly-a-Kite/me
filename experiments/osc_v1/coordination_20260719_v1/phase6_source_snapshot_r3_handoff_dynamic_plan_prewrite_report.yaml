coverage:
  负向复核: >-
    The external payload's git_head differs from the current authority HEAD.
    Source verification explicitly checks this binding, so treating the
    ancestor relation as a current re-verification is rejected by invariant.
    A source digest alone is not a dynamic plan, receipt index, artifact, or
    gate result.
  独立反例验证: >-
    R2 is still unchanged at its separate clean authority head but lacks the
    required scripts/osc surface; the R3 handoff does not rewrite or relabel
    R2.
  异常输入验证: >-
    Static verifier paths reject plan hash mismatch, invalid JSON, exact-field
    schema mismatch, old schema, source mismatch, malformed record fields,
    duplicate/unordered identities, and false bug_claimed. No such dynamic
    plan was constructed or admitted in this prewrite task.
findings:
  - id: OSC-6-SOURCE-HANDOFF-R3-B1
    severity: blocker
    claim: >-
      R3's external source payload remains exact evidence, but it is bound to
      source commit 8367c051 while the current authority clone HEAD is
      2e9576a. It cannot be represented as a current-head VerifiedSourceSnapshot
      without a new clean-source handoff authority.
    reproduction: >-
      payload_git_head=8367c0519d2252c3b507703114b67b474aac636c;
      current_authority_head=2e9576a4c721c2dee6c2eb7ab154fea47846f10d;
      equality is false although ancestry is true. verify_source_snapshot
      checks git-head equality.
    violated_invariant: >-
      A verified source snapshot must bind the exact current clean source
      worktree, not merely an ancestor revision or a source digest string.
    required_test: >-
      Under a fresh narrowly authorized clean-source handoff contract, create
      a clean isolated Git worktree rooted at 8367c051, verify the exact
      payload against it, and prove a different-head re-verification fails
      closed.
    disposition: open_new_authority_required
  - id: OSC-6-R-B3
    severity: blocker
    claim: >-
      No dynamic plan, typed receipt index, raw artifact, or artifact-manifest
      producer chain exists. The R3 source handoff prewrite identifies these
      dependencies but does not create them.
    disposition: unchanged_open
  - id: OSC-6-G-B1
    severity: blocker
    claim: >-
      No gate-eligible real-adapter 232/384/502 evidence with fresh producer
      evidence exists.
    disposition: unchanged_open
