definitions_frozen:
  full_canonical_corpus:
    schema_id: osc-phase6-contract-full-canonical-v1
    exact_decision_count: 100000
    full_identity_binding: >-
      ResultGroup, ordered endpoint set, contract fingerprint, source case,
      source snapshot, comparator identity, fingerprint task/result and exact
      task/result are all typed and independently bound.
  correctness_and_audit:
    - contract.fingerprint_full_canonical_equivalence: 100 percent of all 100000 decisions
    - contract.mismatch_full_diff_escalation: 100 percent of the exact mismatch subset
    - contract.equal_fingerprint_full_audit_deviations: zero across every equal-fingerprint decision
    - contract.backend_clustering_pairwise_equivalence: 100 percent of all 100000 partitions
  paired_efficiency:
    cohort: exactly 1000 deterministic no-replacement eligible decisions selected from the full corpus
    baseline: always-materialize explicit pairwise comparison
    treatment: staged planner with exact escalation
    raw_metrics:
      - materialized_bytes
      - backend_pair_comparisons
      - comparison_cpu_ns
    thresholds:
      comparison_cpu_reduction: aggregate reduction >= 30 percent
      materialized_bytes_reduction: aggregate reduction >= 30 percent and deterministic paired 95 percent lower bound > 0
      backend_pair_comparison_reduction: aggregate reduction >= 30 percent and deterministic paired 95 percent lower bound > 0
    bootstrap: >-
      10000 deterministic resamples of the 1000 sorted pairs, SHA-256-derived
      seed, nearest-rank 2.5th percentile index 249; any non-positive baseline
      observation, missing pair, context mismatch, or invalid raw value is
      not_evaluated/fail closed.
