required_invariants:
  - >-
    The writer must accept only the exact existing private real-adapter sample
    shape generated from the selected declaration-derived fresh cell/pair, and
    must bind source snapshot digest/bytes, exact task and seed lineage, source
    case, result group, endpoint order, execution mode, adapter records, raw
    and normalized bytes/digests, command digest, and target/version metadata.
  - >-
    Serialization must be canonical, create a new external file atomically,
    refuse existing/symlink/escaped paths, and be re-verifiable from bytes.
    No caller-supplied summary, seed, source, task, record, or output binding
    may be substituted after capture.
  - >-
    The artifact is permanently diagnostic-only: authority_eligible=false,
    gate_credit=false, dynamic_plan_emitted=false, typed_receipt_index_emitted=false,
    coverage_event_created=false, candidate_confirmed=false, and bug_claimed=false.
  - >-
    The test suite must use injected in-memory sample data or mocks only: it
    must launch zero adapters and create no reserved external artifact. The one
    actual pair invocation is deferred until a successor source snapshot binds
    this new writer and a separate execution authority names the exact command.
negative_review_requirements:
  负向复核:
    - source snapshot, task/seed/result/outcome, record order/digest, command digest, and existing/symlink output substitutions fail closed
  独立反例验证:
    - a structurally valid private sample cannot acquire gate credit, receipt-index authority, coverage, confirmation, or bug claim by serialization
  异常输入验证:
    - malformed canonical JSON, unverified source snapshot, wrong family/pair/version, wrong seed, non-OK record, escaped path, and write race fail closed
forbidden:
  - public exports, public_api_freeze.json, all frozen target paths, existing diagnostic-sample module, existing source snapshot module, gate authority module, receipt/provenance modules, or any path outside authorization_boundary
  - all external output writes, real adapter launch, dynamic plan, typed receipt index, formal artifact receipt, coverage event, gate calculation, candidate confirmation, or bug_claimed=true during this implementation contract
  - tests/osc whole directory, six-file combined suite, repository suite, 100000 parity, v3 2200, Phase 7, 2h, or 24h execution
