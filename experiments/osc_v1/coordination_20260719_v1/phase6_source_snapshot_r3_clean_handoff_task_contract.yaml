required_invariants:
  - >-
    The positive verification uses the immutable external payload unchanged and
    a clean isolated source worktree at the payload's exact Git HEAD and exact
    scoped Git-status digest. No payload is created, copied, or persisted.
  - >-
    Authority metadata is intentionally kept in a separate clone. It must
    never be substituted for the clean source worktree; verification from its
    different HEAD must fail closed with source_snapshot_git_head_mismatch.
  - >-
    The clean source worktree retains the exact R3 commit/tree and approved
    602-path manifests, has no remote and no dirty paths. R2 and R3 stay
    untouched and clean.
  - >-
    A positive VerifiedSourceSnapshot resolves only the current-head source
    handoff blocker. It grants no dynamic-plan, receipt, artifact, coverage,
    contract, granularity, runtime, combined-suite, candidate, or bug credit.
  - >-
    All thirteen frozen/public target SHA-256 values remain exact; public
    exports, public freeze, frozen files, candidate status, and bug claims do
    not change.
negative_review_requirements:
  负向复核:
    - metadata authority clone at a different Git HEAD rejects the same payload before admission
    - a source digest string alone cannot substitute for source payload byte/hash/head/status bindings
  独立反例验证:
    - R2 remains clean yet lacks the required scripts/osc source surface and stays not gate-compatible
  异常输入验证:
    - substituted expected payload SHA and malformed/missing payload bindings remain fail-closed; no altered payload is persisted
forbidden:
  - original workspace, R2, R3, clean source worktree, product code, tests, public exports, public API freeze, frozen targets, or source payload modification
  - dynamic gate plan, typed receipt index, raw artifact, coverage event, producer/provenance record, bundle, preflight, publication, gate calculation, or gate result
  - tests/osc, six-file combined suite, repository suite, 100000 parity, v3 2200, Phase 7, 2h, or 24h execution
  - candidate confirmation, diagnostic promotion, confirmed status, or bug_claimed=true
validation:
  test_execution_count: 0
  authorized_read_only_api_validation: >-
    One PYTHONDONTWRITEBYTECODE=1 invocation may import the verifier from the
    clean source worktree and call verify_source_snapshot with the immutable
    external payload once against the clean worktree and once against the
    separate metadata authority clone. It must record both complete results.
  allowed_read_only_commands:
    - JSON/YAML parsing, SHA/commit/tree/status/remote checks, and manifest recomputation
    - frozen/public SHA checks and exact authority-path scope checks
  required_report_contents:
    - positive current-head verification evidence and source/status bindings
    - negative different-head failure evidence
    - R2/R3/original preservation evidence
    - 负向复核, 独立反例验证, 异常输入验证 results and unchanged gate state
stop_conditions:
  - any source payload, source/tree/manifest, frozen/public SHA, remote, or original-worktree mismatch
  - positive source verification failure or accepted different-head verification
  - any write outside the three metadata authority paths
  - any claimed gate credit, dynamic plan, receipt, artifact, coverage, candidate confirmation, or bug claim
