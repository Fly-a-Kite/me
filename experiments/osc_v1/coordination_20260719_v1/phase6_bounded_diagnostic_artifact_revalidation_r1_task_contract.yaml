required_invariants:
  - >-
    Revalidation must first verify exact artifact bytes, source snapshot, and
    runner SHA, then rebuild the fixed declaration-derived fresh cell/pair,
    typed results, evidence, sample, and every serialized context identity.
    It must fail closed before returning any revalidated object for a changed
    task, result, seed, outcome, evidence, sample, record, or source binding.
  - >-
    Revalidation must not invoke capture_real_adapter_execution_sample,
    make_backend, execute_case, subprocess, a runner, or any external writer.
    Tests may construct only in-memory fake records and pytest-temporary
    diagnostic files; the existing external R1 artifact is read-only.
  - >-
    The returned state remains permanently private and not_evaluated with
    diagnostic_only=true, authority_eligible=false, gate_credit=false,
    dynamic_plan_emitted=false, typed_receipt_index_emitted=false,
    coverage_event_created=false, candidate_confirmed=false, and
    bug_claimed=false. It cannot serialize a receipt, raw-gate artifact,
    producer receipt, index, plan, coverage event, authority bundle, or gate.
  - >-
    One revalidated artifact cannot satisfy any formal producer kind by itself;
    the 10-kind receipt-index requirement, 18-section dynamic plan, 232/384/502
    denominators, 100000 comparisons, v3 2200, repository gate, and all formal
    Phase-6 barriers remain pending.
  - >-
    No public export, public API freeze, frozen target, writer/runner, gate
    authority, existing source snapshot, existing artifact, or external path
    may be modified.
negative_review_requirements:
  负向复核:
    - >-
      Artifact SHA/source/runner substitutions and exact task/result/seed/
      outcome/evidence/sample/record context substitutions must fail closed in
      a deterministic first-error order.
    - >-
      A current artifact with a valid private schema must still be rejected as
      a formal receipt-index substitute because it is not the raw-gate schema
      and no complete 10-kind producer set exists.
  独立反例验证:
    - >-
      A legal temporary private sample revalidates exactly but remains
      not_evaluated with all authority, promotion, and bug flags false.
  异常输入验证:
    - >-
      Missing/unreadable/relative/tampered artifact input, malformed canonical
      records, changed binding identities, and stale source/runner inputs fail
      closed without adapter execution or durable output.
