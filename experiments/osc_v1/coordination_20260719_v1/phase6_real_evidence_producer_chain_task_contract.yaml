required_invariants:
  - >-
    The implementation may stage only evidence derived from actual typed
    runtime objects and an observed subprocess transcript. It must reject
    caller-authored dicts, placeholder digests, synthetic labels, mutable
    objects, missing result/outcome/task/seed bindings, source mismatch, and
    uninspectable or unresolved execution context before any receipt staging.
  - >-
    The capture boundary must bind command, cwd, executable identity, selected
    environment allowlist, start/end, exit code, stdout/stderr digests, output
    digest, isolated clean source digest, and exact typed subject identities.
    A test-double or dry-run capture is permanently diagnostic-only.
  - >-
    The new runner defaults to prepare-only/dry-run behavior and must refuse
    durable output, dynamic-plan emission, artifact-receipt index emission,
    authority-bundle publication, or gate calculation without a successor
    authority that names a clean source snapshot, explicit output directory,
    workload budget, and command digest.
  - >-
    No local code path may claim a producer receipt is valid by itself. Existing
    Root verifiers remain the sole consumer of persisted records; verifier
    rejection, incomplete producer sets, and missing typed context remain
    fail-closed and not_evaluated.
  - >-
    The producer chain must preserve four-valued verdicts, exact escalation,
    seed lineage, task/result/spec/outcome/evidence binding, fresh/regression
    separation, and worker-count invariance. Candidate state remains
    non-confirmed and bug_claimed=false.
  - >-
    Private schema changes are prohibited in this task. If the frozen verifier
    cannot validate a genuinely captured record without relaxing a check, stop,
    record the incompatibility, and request a new narrow authority rather than
    changing an authority schema or verifier.
required_negative_coverage:
  负向复核:
    - a caller-authored digest, planned identifier, test fixture, or diagnostic sample cannot be emitted as gate-eligible evidence
    - a subprocess with nonzero exit, source mismatch, changed output, escaped path, or incomplete typed binding is rejected before receipt staging
    - an incomplete ten-producer set cannot generate a dynamic plan, artifact receipt index, or authority bundle
  独立反例验证:
    - the existing one-pair diagnostic sample and all support scripts remain diagnostic/support-only after the new capture boundary is introduced
    - a source-valid but process-unbound payload has no Phase-6 credit
  异常输入验证:
    - malformed typed envelope, duplicate identity, wrong task/result/spec/seed/outcome binding, unordered input, mutable context, synthetic marker, and stale source digest fail closed
implementation_deliverables:
  - >-
    A private runtime capture/staging module with explicit typed inputs,
    process-transcript binding, canonical immutable serialization, and a
    fail-closed diagnostic-only result type.
  - >-
    A private script that defaults to dry-run/prepare-only and cannot launch a
    formal workload or persist authority material under this contract.
  - >-
    Focused regression tests that exercise the negative, counterexample, and
    exceptional-input invariants using pytest tmp_path only.
  - >-
    A completion report with exact changed paths, pre/post SHA, a single
    terminal scoped-suite result, no durable output, and unchanged pending
    formal gates.
validation:
  run_only_after_implementation: true
  maximum_scoped_suite_runs: 1
  command: >-
    PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
    tests/osc/test_runtime_phase6_real_evidence_producer_chain.py
    tests/osc/test_runtime_gate_artifacts.py
    tests/osc/test_phase6_gate_authority_integration.py
  expected: >-
    exit code 0 with complete terminal result; no durable plan/receipt/artifact
    output, no gate credit, and all frozen/public SHA values exact before and
    after the one scoped suite.
prohibited_execution:
  - tests/osc directory suite, repository suite, six-file combined suite, 100000 parity, v3 2200, Phase 7, 2h pilot, and 24h execution
  - any dynamic plan JSON, typed artifact receipt index, raw authority artifact, authority bundle, source payload, or gate manifest persistence
  - public export, public API freeze, frozen file, authority verifier, gate artifact schema, contract/search/parallel core, legacy datadiff, TODO, launcher, or current-worktree modification
  - candidate confirmation, diagnostic promotion, confirmed status, or bug_claimed=true
stop_conditions:
  - any frozen/public SHA mismatch, original worktree/index/HEAD change, clone remote, or authority path outside this contract
  - any requirement to relax an existing verifier, gate floor, exact binding, source binding, or typed replay check
  - any planned or actual formal execution, durable authority output, gate credit, or candidate/bug claim
  - any scope need outside the three allowed product write paths
barrier_state_before_implementation:
