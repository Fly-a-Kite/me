  candidate_confirmed: false
  bug_claimed: false
successor_authority_required_for_real_execution: >-
  After implementation and a fresh clean-source snapshot that includes the
  new code, a separate authority must name the exact isolated output directory,
  command digest, clean source commit, target versions, seed exclusion and
  workload budget before any real evidence workload can start. This contract
  grants none of those execution permissions.
