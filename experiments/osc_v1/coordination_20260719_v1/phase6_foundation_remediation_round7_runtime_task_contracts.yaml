  required_invariants:
    - >-
      Retain the R6 global identity/disjointness first check for task IDs, complete TaskSpec
      digests, result IDs, seed lineages, and EvidenceEnvelope digests. With uniqueness
      preserved, complete source and recheck typed context must then reject before any
      source/recheck verdict, reproduced calculation, or 3/3 plus 3/3 threshold.
    - >-
      The source typed case must reconstruct canonically and bind source_result.case_id; the
      source result must require an OK outcome before source verdict handling. Campaign and
      pipeline must each be an immutable exactly-three tuple with ordinals exactly 1, 2, 3;
      every recheck must bind the source case ID, source ResultGroup, and an OK outcome.
    - >-
      Every source/campaign/pipeline TypedExecutionResult and EvidenceEnvelope keeps exact
      state, result group, task ID, TaskSpec digest, result ID, seed-lineage digest, contract
      fingerprint, target fingerprint, and execution outcome binding. This private ordering
      change must not alter public exports or frozen schemas.
    - >-
      For source verdict INCONCLUSIVE and SATISFIED, crossed with campaign and pipeline, use
      seven globally unique identity/digest values and keep the selected recheck EvidenceEnvelope
      bound to its own result. Independently mutate the selected recheck case ID, ResultGroup,
      non-OK outcome, and ordinal; each first failure must be that exact typed-context failure,
      never `candidate source lacks a typed VIOLATED witness`.
    - >-
      R6 task/result/spec/result-ID/seed/outcome evidence-binding regressions, global collision
      precedence, recheck reproduction thresholds, and legal seven distinct typed VIOLATED
      inputs remain unchanged: legal inputs are STABLE_SURVIVOR, non-confirmed, bug_claimed=false.
    - >-
      Confirmed state, caller-provided reproduced, diagnostic promotion, public authority
      promotion, mutable or malformed provenance, and missing exact typed context remain
      rejected, fail closed, or not_evaluated. Diagnostic refs remain permanently diagnostic-only.
    - >-
      Public API/export/freeze, thresholds, denominators, comparator semantics, replay
      authority, all frozen paths, Phase 7, 2h, and 24h authorization remain unchanged and
      unauthorized.
  required_negative_review_and_regressions:
    - >-
      INCONCLUSIVE/SATISFIED × campaign/pipeline × case/result-group/non-OK-outcome/ordinal.
      Preserve all seven identities and make each selected EvidenceEnvelope match its own result.
      The exact context error must precede source verdict in every case.
    - >-
      Re-run R6 task ID, result-group, seed, and outcome exact EvidenceEnvelope binding attacks,
      plus task/TaskSpec/result/seed/envelope global collisions, before verdict/reproduced/threshold.
    - >-
      Check legitimate seven distinct typed VIOLATED inputs, 3/3+3/3 thresholds, confirmed state,
      caller reproduced field, diagnostic origin, missing context, and malformed typed provenance.
