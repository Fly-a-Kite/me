schema_version: osc-change-request-ledger-v1
phase: 5
requests:
  - id: CR-OSC-5-001
    requester: contract
    symbol: HyperContract.registry_digest / ContractFingerprint.registry_digest semantics
    reason: >-
      HyperContract.registry_digest was populated with the compiler rule-registry
      digest while exact authority is executed by a separate RelationRegistry.
      The existing meaning cannot reject a same-metadata replacement evaluator.
    minimal_change: >-
      Keep every public field, type, order, dataclass, and schema version unchanged.
      Freeze registry_digest as the authority RelationRegistry digest, including
      versioned trusted evaluator implementation identities. Keep
      DerivationCertificate.rule_registry_digest as the separate compiler-rule
      binding. Reject any registry mismatch before screening or exact evaluation.
    alternatives_considered:
      - alternative: add relation_registry_digest to public dataclasses
        decision: rejected
        reason: unnecessary larger migration and new public schema version
      - alternative: hash callable names/source without comparing to the contract fingerprint
        decision: rejected
        reason: does not prevent evaluator substitution
      - alternative: ignore caller registry and always use the current default
        decision: rejected
        reason: does not prove that an older contract was compiled against the current evaluator version
    affected_tests:
      - tests/osc/test_contract_authority.py
      - tests/osc/test_public_api_freeze.py
      - tests/osc/test_comparison_staged.py
    owner: root_then_contract
    status: accepted_root_manifest_updated
    prior_manifest_sha256: 669816be0f913def018518ea85d2cc03b517453cc8e5ba764908dc3c3f42920f
    updated_manifest_sha256: cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
    freeze_validation: tests/osc/test_public_api_freeze.py -> 7 passed in 0.25s
    field_shape_changed: false
    schema_version_changed: false
    twenty_four_hour_run_authorized: false
  - id: CR-OSC-5-002
    requester: root_contract_barrier_review
    symbol: authority Endpoint evidence routing and exact-path ownership
    reason: >-
      Root independently reproduced that a v1-only contract can be rebound to a
      v9 Endpoint and still return SATISFIED when monitor_exact receives neither
      the original Endpoint tuple nor independently bound observation provenance.
      Matching metadata.endpoint_digest to a replaced certificate endpoint digest
      also remains forgeable and does not permit backend/version/mode/layout
      revalidation.
    minimal_change: >-
      Keep every frozen dataclass field, type, order, schema version, and manifest
      entry unchanged. Require every authority comparison to receive the original
      Endpoint tuple, re-run applicability scope/capability/digest validation, and
      require every Observation metadata.endpoint_digest to equal the corresponding
      recomputed Endpoint digest. Route Endpoint tuples through the non-frozen
      StagedComparisonEngine wrapper and the Phase 6 parity fixture. Missing either
      authority input fails closed before screening or exact evaluation.
    alternatives_considered:
      - alternative: trust certificate.endpoint_digests without Endpoint objects
        decision: rejected
        reason: the certificate can be replaced and the digest does not expose scope fields
      - alternative: trust matching observation and certificate digest strings
        decision: rejected
        reason: both strings can be forged together and v1-to-v9 rebinding still passes
      - alternative: add Endpoint payload fields to frozen public certificates
        decision: rejected
        reason: unnecessary public schema migration because the original Endpoint tuple already exists at execution time
    affected_source:
      - src/datadiff_osc/contract_engine/applicability.py
      - src/datadiff_osc/comparison/staged.py
      - scripts/osc/audit_staged_parity.py
    affected_tests:
      - tests/osc/test_contract_authority.py
      - tests/osc/test_contract_relations_planner.py
      - tests/osc/test_contract_two_pass_properties.py
      - tests/osc/test_contract_entailment.py
      - tests/osc/test_contract_v1_compatibility.py
      - tests/osc/test_comparison_staged.py
    owner: contract_then_root
    status: accepted_exact_path_expansion_no_frozen_interface_change
    manifest_sha256: cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
