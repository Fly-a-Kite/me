  frozen_interfaces:
    - osc-public-api-freeze-v1:cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
    - osc-pre24-gate-spec-set-d9792996cacb6fc6e47bce602d5f7ab6d6382c62ba9e1ac6bc1f8003ecbec552
    - all thirteen frozen_target_sha256 entries above
    - R5 ParallelScalingEvidenceReceipt v1
    - R6 ParallelScalingProductionObservation private construction contract
  required_invariants:
    - >-
      The new Runtime module is private and adds no public export. It owns one
      canonical provenance payload containing a complete
      ParallelScalingProductionObservation, the derived R6 receipt, and exact
      implementation-byte bindings. It accepts no caller-authored receipt,
      sample, source, task/result/evidence, worker, counter, configuration, or
      implementation digest as a substitute for a typed rebuild.
    - >-
      Reconstructing the provenance payload must exact-round-trip every nested
      ResultGroup, TaskSpec, SeedLineage, StructuredExecutionOutcome,
      WorkerBoundExecutionResult, raw counter/clock and EvidenceEnvelope using
      the owning private replayers. The bridge must invoke the R6 builder again
      and reject any changed source, task/result, seed, outcome, evidence,
      worker count, raw counter, configuration, clock, logical task graph, or
      receipt byte/identity before returning a usable provenance result.
    - >-
      Root may make a provisional exception to the general Runtime-provenance
      rejection only for ParallelScalingEvidenceReceipt under
      performance_paired_replay and only while a separately declared canonical
      provenance binding is present. Root must then require a one-to-one exact
      admission/provenance pairing, re-hash both files, reconstruct the proof,
      compare the re-derived receipt to the admitted canonical receipt, and
      bind its digest into VerifiedProducerReceipt. A missing, duplicate,
      unreadable, stale, malformed, wrong-schema, wrong-path, wrong-admission,
      wrong-source, or extra provenance record fails closed and removes that
      Runtime admission from retained producer evidence.
    - >-
      The pre-existing general Runtime provenance-pending behavior remains
      fail-closed for every other Runtime envelope and for direct helper use.
      A legacy PairedBenchmarkReceipt, a digest-only assertion, a same-cardinality
      substitution, or a caller-created dynamic record cannot bypass the new
      pairing check.
    - >-
      A legal bridge fixture is still an incomplete, non-publishable receipt
      index because no complete required producer set, canonical raw artifact,
      100000 corpus, 1000-pair cohort, bootstrap, metric calculation, or gate
      evidence is created by this task. No artifact may be treated as real
      execution merely because it contains this private proof.
    - >-
      Diagnostic refs remain permanently diagnostic-only. Missing exact typed
      context is fail-closed/not_evaluated. No candidate is confirmed,
      bug_claimed remains false, and no public/gate/Phase-7/2h/24h authority is
      created.
  required_tests:
    负向复核:
      - >-
        Mutate one nested source, ResultGroup, TaskSpec, seed, outcome,
        EvidenceEnvelope, worker-count, raw-counter, clock, configuration,
        logical-dependency, receipt, or implementation-byte binding at a time;
        assert canonical reconstruction or the Root exact-pairing check rejects
        it before retained Runtime evidence or a dynamic record can contribute.
      - >-
        Demonstrate absent proof, post-admission receipt/proof byte mutation,
        duplicate proof/admission, proof-admission swap, source rebind, extra
        proof, and same-cardinality receipt substitution all fail closed.
    独立反例验证:
      - >-
        Build one legal R6 observation and provenance envelope, admit it through
        an otherwise incomplete private receipt index, and confirm Root retains
        only the exact paired parallel admission while the index remains invalid
        and non-publishable for all missing producer/artifact requirements.
      - >-
        Confirm a changed valid observation creates a different provenance and
        receipt identity and cannot bind the prior admission or source.
    异常输入验证:
      - >-
        Reject missing/extra payload fields, malformed digests, unordered or
        duplicate bindings, unsupported schema/type, path escape, wrong object
        type, invalid canonical envelope, and unsupported legacy receipt without
        throwing, publication, candidate confirmation, or bug claim.
  scoped_validation:
    command: >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      tests/osc/test_runtime_phase6_parallel_scaling_provenance.py
      tests/osc/test_runtime_phase6_parallel_scaling_producers.py
      tests/osc/test_runtime_phase6_parallel_scaling_receipts.py
      tests/osc/test_phase6_gate_authority_integration.py
    timing: exactly once, only after all allowed implementation writes and SHA checks
    forbidden_substitutes:
      - tests/osc
      - repository suite
      - six-file combined suite
      - 100000 parity execution
      - v3 2200
      - Phase 7
      - 2h pilot
      - 24h run
  completion_requirements:
    - reverify all allowed product paths and all thirteen frozen/public SHA values before the scoped suite
    - retain the exact command, exit code, and complete terminal result in the report
    - reverify all allowed product paths and all thirteen frozen/public SHA values after the scoped suite
    - use apply_patch for the report and ledger only after the real terminal result is known
    - retain phase_6_contract as pending regardless of scoped-suite outcome
  stop_conditions:
    - any frozen/public SHA mismatch, staged user path, pre-existing target path, or scope expansion
    - any need to modify a public export, frozen producer/provenance/test, R5/R6 receipt/producer, semantic replay, gate artifacts/spec, docs, or scripts
    - any accepted unpaired Runtime receipt, caller-authored identity/digest proof, retained legacy paired receipt, artifact/gate pass, candidate confirmation, or bug_claimed=true
    - failed scoped suite or incomplete terminal test evidence
