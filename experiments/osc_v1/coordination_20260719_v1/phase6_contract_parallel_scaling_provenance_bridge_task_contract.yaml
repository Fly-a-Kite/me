task:
  task_id: OSC-6-CONTRACT-PARALLEL-SCALING-PROVENANCE-BRIDGE-R7
  objective: >-
    Add a private, Root-verifiable provenance bridge for one R6
    ParallelScalingEvidenceReceipt. The bridge must preserve an exact typed
    production observation, re-read it at the Root boundary, rebuild the R6
    receipt, and admit the receipt only when a unique canonical provenance
    record binds the same admission, source, receipt bytes and receipt identity.
    It is evidence plumbing only and cannot itself make an artifact, metric,
    denominator, bundle, candidate, or gate authoritative.
  allowed_write_paths:
    - src/datadiff_osc/runtime/_phase6_parallel_scaling_provenance.py
    - src/datadiff_osc/_phase6_gate_authority.py
    - tests/osc/test_runtime_phase6_parallel_scaling_provenance.py
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_parallel_scaling_provenance_bridge_task_contract.yaml
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_parallel_scaling_provenance_bridge_report.yaml
    - experiments/osc_v1/coordination_20260719_v1/coordination_ledger.yaml
  forbidden_write_paths:
    - src/datadiff_osc/__init__.py
    - src/datadiff_osc/public_api_freeze.json
    - src/datadiff_osc/search/**
    - src/datadiff_osc/contract_engine/**
