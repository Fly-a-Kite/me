      Run the recorded scoped command.  The byte mutation at
      test_runtime_phase6_parallel_scaling_receipts.py:243 makes the admission
      hash mismatch first, then leaves no decoded receipt to match the record.
    violated_invariant: >-
      The R5 required test states that a one-field mutation must assert the
      first Root exact binding failure.  The test overconstrains later,
      fail-closed accumulator diagnostics and cannot establish a passing
      R5 authority result.
    required_test: >-
      A newly authorized isolated remediation must retain the byte-mutation
      counterexample, assert errors[0] is the exact admission hash mismatch,
      assert errors is nonempty/fail-closed, and preserve all no-authority
      boundaries.  It must not change product logic merely to hide later
      diagnostics unless a distinct negative finding demonstrates that the
      first failure is wrong.
