root_follow_up:
  - Root may write only the R5 report set and coordination ledger after all three reports return
  - Root may run the exact six-file combined scoped suite once only when all three genuinely independent reports have blocker=0, high=0, medium=0 and all pre/post target SHA values match
  - Root must re-hash all thirteen target files before and after that combined suite
  - no foundation barrier pass may be prewritten; it is decided only from actual three-report, SHA, combined-suite, and frozen-SHA evidence
exit:
  foundation_barrier_pending_until:
    - all three direct read-only reports are received
    - aggregate blocker=0, high=0, and medium=0
    - all target pre/post SHA values match this contract
    - the root's exact six-file combined scoped suite passes with pre/post target SHA matches
    - frozen Contract and public API SHA values remain exact
  failed_or_nonzero_findings: record the finding, retain foundation_barrier pending, and require a new remediation task contract before any code change
