task:
  task_id: OSC-6-CONTRACT-COMPARISON-EVIDENCE-R1
  objective: >-
    Establish a private, canonical, semantically replayable full-canonical
    comparison-decision receipt. This is only the typed-evidence prerequisite
    for Phase-6 Contract gates; it must remain Root-context-pending and cannot
    make any gate publishable.
  allowed_write_paths:
    - src/datadiff_osc/contract_engine/_phase6_comparison_receipts.py
    - src/datadiff_osc/contract_engine/replay.py
    - src/datadiff_osc/_phase6_gate_authority.py
    - tests/osc/test_contract_phase6_comparison_receipts.py
    - tests/osc/test_contract_semantic_replay.py
    - tests/osc/test_phase6_gate_authority_integration.py
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_comparison_evidence_task_contract.yaml
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_comparison_evidence_report.yaml
    - experiments/osc_v1/coordination_20260719_v1/coordination_ledger.yaml
  forbidden_write_paths:
    - src/datadiff_osc/__init__.py
    - src/datadiff_osc/public_api_freeze.json
    - src/datadiff_osc/runtime/**
    - src/datadiff_osc/search/**
    - src/datadiff_osc/contract_engine/_phase6_corpora.py
    - tests/osc/test_contract_phase6_corpora.py
    - tests/osc/test_search_context_receipts.py
    - tests/osc/test_search_gate_crosswalk.py
    - tests/osc/test_search_lane_registry.py
    - tests/osc/test_runtime_receipt_producers.py
    - tests/osc/test_runtime_producer_provenance.py
    - src/datadiff_osc/runtime/_producer_provenance.py
    - src/datadiff_osc/runtime/gates.py
    - src/datadiff_osc/runtime/gate_artifacts.py
    - docs/**
    - scripts/**
  read_only_dependencies:
    - src/datadiff_osc/contract_engine/evidence.py
    - src/datadiff_osc/contract_engine/model.py
    - src/datadiff_osc/contract_engine/planner.py
    - src/datadiff_osc/schemas.py
  frozen_interfaces:
    - osc-public-api-freeze-v1:cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
    - osc-pre24-gate-spec-set-d9792996cacb6fc6e47bce602d5f7ab6d6382c62ba9e1ac6bc1f8003ecbec552
    - all thirteen frozen_target_sha256 entries above
  required_invariants:
    - >-
      The new receipt is private: no public export and no public API/freezing
      artifact changes. It has one exact new schema version and a replayer that
      rejects old, unknown, missing, extra, malformed, or non-canonical payloads
      fail closed.
    - >-
      It carries raw typed identity for one comparison decision: source snapshot
      digest, source case digest, ResultGroup, HyperContract, canonical ordered
      Endpoint collection, and both a FINGERPRINT_CLUSTER and a distinct
      FULL_DIFF TaskSpec/request/result/certificate chain. It must derive rather
      than accept caller-authored comparison-decision ID, endpoint-set digest,
      task IDs, result IDs, equality booleans, or partitions.
    - >-
      The receipt validates ResultGroup/HyperContract/endpoint ordering and
      source-case binding, contract and registry fingerprints, request payload
      binding, result request/certificate/endpoint binding, seed lineage, task
      kind, task distinctness, result distinctness, and outcome/verdict binding
      before it derives any comparison identity.
    - >-
      Raw component fingerprints and raw canonical endpoint values are required.
      Fingerprint equality, full-canonical equality, the fingerprint cluster
      partition, and the explicit pairwise-canonical partition are recomputed
      from those raw values. Declared booleans, declared partitions, scalars, or
      digest-only substitutes are not accepted. A FULL_DIFF task must be forced
      exact and its result/certificate must prove exact escalation.
    - >-
      The Contract replay owner may derive exactly one local
      contract_comparison_decision_ids subject from a valid receipt. Root must
      recognize the new private envelope with exactly one Contract replay owner,
      but retain that subject in _ROOT_CONTEXT_PENDING_SUBJECTS so a successful
      intrinsic replay still cannot become a retained admission, denominator,
      gate pass, publication, or execution authorization in this task.
    - >-
      Existing 25 envelope ownership remains one-owner-per-pair; this additive
      private type changes the current ownership check only to 26 total pairs
      and 7 Contract-owned pairs. No existing envelope mapping may be relaxed.
    - >-
      Diagnostic refs remain diagnostic-only; every success-shaped and failing
      fixture keeps candidates non-confirmed and bug_claimed=false. No new gate
      spec, raw metric reducer, paired performance receipt, producer provenance,
      100000-corpus execution, combined suite, Phase 7, 2h, or 24h execution is
      authorized.
  required_tests:
    负向复核:
      - >-
        Mutate one source, case, contract, endpoint order, task kind, task
        payload, request/result/certificate, seed, result identity, fingerprint,
        canonical value, or partition relation at a time and reject before a
        Root admission can be retained.
      - >-
        Verify an equal fingerprint with unequal canonical raw values, a
        mismatch with an unforced/non-exact FULL_DIFF chain, and non-equivalent
        fingerprint versus pairwise partitions all fail closed.
    独立反例验证:
      - >-
        Demonstrate a legal typed receipt derives the same identity after
        canonical serialization/replay, then demonstrate that a same-cardinality
        endpoint substitute, a digest-only substitute, and a stale schema cannot
        derive that identity.
    异常输入验证:
      - >-
        Reject missing/extra fields, duplicate IDs, empty vectors, malformed
        immutable values, bad schema versions, unsupported task kinds, stale
        source context, and malformed canonical envelopes without throwing or
        authorizing a gate.
    root_boundary:
      - >-
        Verify unique replay ownership for all 26 allowed pairs and that a valid
        new receipt is rejected at the Root context-pending boundary with no
        publishable bundle or gate state change.
  scoped_validation:
    command: >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      tests/osc/test_contract_phase6_comparison_receipts.py
      tests/osc/test_contract_semantic_replay.py
      tests/osc/test_phase6_gate_authority_integration.py
    timing: exactly once, only after all allowed implementation writes and SHA checks
    forbidden_substitutes:
      - tests/osc
      - repository suite
      - six-file combined suite
      - 100000 parity execution
      - v3 2200
      - Phase 7
      - 2h pilot
      - 24h run
  completion_requirements:
    - reverify all allowed paths and all thirteen frozen/public SHA values before the scoped suite
    - retain complete scoped-suite command, exit code, and result in the report
    - reverify all allowed paths and all thirteen frozen/public SHA values after the scoped suite
    - use apply_patch for the report and ledger only after the real terminal result is known
    - retain phase_6_contract as pending regardless of scoped-suite outcome
  stop_conditions:
    - any frozen/public SHA mismatch, staged user path, pre-existing new path, or scope expansion
    - any need to modify a public export, gate spec, runtime producer, paired receipt, or a frozen target
    - any accepted caller-authored identity/equality/partition or any Root admission/publish/gate pass
    - a failed scoped suite or incomplete terminal test evidence
