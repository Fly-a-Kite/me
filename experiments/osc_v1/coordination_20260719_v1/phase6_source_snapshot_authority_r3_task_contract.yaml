    verify_source_snapshot invocation against the isolated R3 clone using the
    exact _required_source_paths subset, one external temporary
    source-snapshot JSON, and one in-memory negative required-path omission.
  required_result: >-
    Record exact command, exit code, complete result, source digest, snapshot
    byte SHA-256, git head/status digest, required-path count, positive valid
    result, and negative fail-closed error.
