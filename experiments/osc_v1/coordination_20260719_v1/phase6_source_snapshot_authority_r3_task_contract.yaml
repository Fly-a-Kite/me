required_invariants:
  - >-
    The R3 source commit must retain exactly the confirmed 602 paths and both
    manifest digests, have the declared parent/tree, a clean source payload
    worktree before authority writes, and no remote.
  - >-
    The committed R3 tree must separately retain all 602 confirmed paths and
    both manifest digests. The one API validation must use exactly the
    verifier-discovered _required_source_paths subset (rather than authority
    files added after the source commit), and verify_source_snapshot must
    return valid=true while binding the current R3 commit and its source-status
    digest.
  - >-
    Omitting exactly scripts/osc/build_phase6_gate_authority_bundle.py from
    the selected list must fail closed in source_snapshot_payload before a
    payload is returned, with the required-source-path error.
  - >-
    R2 stays immutable and cannot be relabeled gate-compatible. A successful
    R3 source verification resolves only its missing-source-surface defect;
    it does not create gate evidence or close OSC-6-R-B3 or OSC-6-G-B1.
  - >-
    All thirteen frozen/public target SHA-256 values remain exact. No public
    export, public freeze, frozen file, candidate status, or bug claim changes.
negative_review_requirements:
  负向复核:
