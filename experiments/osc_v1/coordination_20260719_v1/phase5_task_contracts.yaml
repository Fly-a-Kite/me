schema_version: osc-task-contract-v1
phase: 5
execution_policy:
  repair_order: [contract, root_contract_binding, search, runtime, root]
  simultaneous_writers: 1
  twenty_four_hour_run_authorized: false
tasks:
  - task_id: OSC-5-A
    role: contract
    mode: implementation
    objective: Repair OSC-4-C-F1 through F5 without weakening exact authority or changing public field shape.
    required_inputs:
      - experiments/osc_v1/coordination_20260719_v1/phase4_review_reports.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_change_requests.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_prewrite_declarations.yaml
      - src/datadiff_osc/public_api_freeze.json
      - docs/semantic_hypercontract_architecture.md
      - docs/codex_multi_agent_development_runbook.md
    allowed_write_paths:
      - src/datadiff_osc/contract_engine/relations.py
      - src/datadiff_osc/contract_engine/applicability.py
      - src/datadiff_osc/contract_engine/monitor.py
      - src/datadiff_osc/contract_engine/planner.py
      - src/datadiff_osc/contract_engine/demand.py
      - src/datadiff_osc/contract_engine/compiler.py
      - tests/osc/test_contract_authority.py
      - tests/osc/test_contract_relations_planner.py
      - tests/osc/test_contract_two_pass_properties.py
      - tests/osc/test_contract_entailment.py
      - tests/osc/test_contract_v1_compatibility.py
    forbidden_write_paths:
      - src/datadiff_osc/_canonical.py
      - src/datadiff_osc/schemas.py
      - src/datadiff_osc/api.py
      - src/datadiff_osc/public_api_freeze.json
      - src/datadiff_osc/semantic_targets/**
      - src/datadiff_osc/generation/**
      - src/datadiff_osc/search/**
      - src/datadiff_osc/scheduler/**
      - src/datadiff_osc/comparison/**
      - src/datadiff_osc/parallel/**
      - src/datadiff_osc/runtime/**
      - scripts/**
      - src/datadiff/**
    frozen_interfaces:
      - osc-public-api-freeze-v1@cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
      - CR-OSC-5-001 accepted semantics
      - four-valued outcome policy
    required_invariants:
      - exact authority RelationRegistry includes validated versioned evaluator identity and must match the contract fingerprint
      - derivation rule registry remains separately bound
      - endpoint backend/version/mode/layout and observation metadata bind end to end
      - top-k preserves multiplicity
      - containment and status relations remain orthogonal
      - timeout/crash/adapter/missing never become pass or unsupported
    deliverables:
      - fixes for OSC-4-C-F1 through F5
      - all mandatory negative regression tests
      - complete section-12 completion report
    validation:
      - command: PYTHONDONTWRITEBYTECODE=1 .venv/bin/pytest -q -p no:cacheprovider tests/osc/test_contract_authority.py tests/osc/test_contract_relations_planner.py tests/osc/test_contract_two_pass_properties.py
        expected: exit 0 and all new counterexamples fail closed as specified
      - command: PYTHONDONTWRITEBYTECODE=1 .venv/bin/pytest -q -p no:cacheprovider tests/osc/test_contract_*.py
        expected: exit 0
      - command: PYTHONDONTWRITEBYTECODE=1 .venv/bin/pytest -q -p no:cacheprovider tests/osc/test_public_api_freeze.py
        expected: 7 passed and manifest hash unchanged
    stop_conditions:
      - any need for a second public interface change
      - any file outside the exact approved list
      - any proposed relaxation of a comparator, certificate, or failure policy
      - any pilot, campaign, or 24h execution
    completion_report: runbook section 12, including per-finding regression evidence

  - task_id: OSC-5-A-ROOT-BINDING
    role: root
    mode: cross_subsystem_integration_after_contract_writer_stops
    objective: Route original Endpoint authority through the staged wrapper and parity fixture without changing frozen fields or schemas.
    required_inputs:
      - completed OSC-5-A endpoint fail-closed repair
      - experiments/osc_v1/coordination_20260719_v1/phase5_change_requests.yaml
      - src/datadiff_osc/public_api_freeze.json
    allowed_write_paths:
      - src/datadiff_osc/comparison/staged.py
      - scripts/osc/audit_staged_parity.py
      - tests/osc/test_comparison_staged.py
    forbidden_write_paths: [contract, search, scheduler, parallel, runtime, legacy, formal launcher]
    frozen_interfaces:
      - osc-public-api-freeze-v1@cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
    required_invariants:
      - original Endpoint tuple reaches applicability scope revalidation
      - every Observation is bound to the recomputed Endpoint digest
      - missing Endpoint or observation digest fails closed
    validation:
      - command: PYTHONDONTWRITEBYTECODE=1 .venv/bin/pytest -q -p no:cacheprovider tests/osc/test_comparison_staged.py tests/osc/test_runtime_scripts.py
        expected: exit 0
      - command: PYTHONDONTWRITEBYTECODE=1 .venv/bin/pytest -q -p no:cacheprovider tests/osc/test_public_api_freeze.py
        expected: 7 passed and manifest hash unchanged
    stop_conditions:
      - any frozen field, type, order, schema version, or manifest change
      - any write outside the exact approved list
      - any pilot, campaign, or 24h execution
    completion_report: root integration ledger entry before Search release

  - task_id: OSC-5-B
    role: search
    mode: implementation_after_contract_barrier
    objective: Repair OSC-4-A-F1 through F4 using real evidence objects, endpoint-bound contrast activation, closed provenance, and universe-derived scheduler denominators.
    required_inputs:
      - experiments/osc_v1/coordination_20260719_v1/phase4_review_reports.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_prewrite_declarations.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_contract_barrier.yaml
      - src/datadiff_osc/public_api_freeze.json
      - completed OSC-5-A contract authority and OSC-5-A-ROOT-BINDING routing
    allowed_write_paths: see exact OSC-5-B list in phase5_prewrite_declarations.yaml
    forbidden_write_paths: [contract, runtime, root shared, legacy, launcher]
    frozen_interfaces: [osc-public-api-freeze-v1, Contract authority after OSC-5-A]
    required_invariants: [real certificate object binding, original Endpoint authority for applicability scope, directional endpoints, physical fresh/regression split, fixed universe denominators]
    deliverables: [F1-F4 fixes, negative regressions, section-12 report]
    validation: [scoped target/generation/search/scheduler tests, public freeze tests]
    stop_conditions: [contract barrier not passed, public change required, exact path list expansion, pilot/campaign/24h request]
    completion_report: runbook section 12

  - task_id: OSC-5-C
    role: runtime
    mode: implementation_after_search_barrier
    objective: Repair OSC-4-B-F1 through F4 with verified raw artifacts, bidirectional cache bindings, dependency blocking, and authority-complete invariance.
    required_inputs:
      - experiments/osc_v1/coordination_20260719_v1/phase4_review_reports.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_prewrite_declarations.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_observation_contract_barrier.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_search_barrier.yaml
      - src/datadiff_osc/public_api_freeze.json
      - completed OSC-5-A, Root observation authority, and OSC-5-B evidence paths
    allowed_write_paths: see exact OSC-5-C list in phase5_prewrite_declarations.yaml
    forbidden_write_paths: [contract, search, root shared, legacy, formal launcher]
    frozen_interfaces: [osc-public-api-freeze-v1, Contract and Search evidence after prior barriers]
    required_invariants: [artifact-backed recomputation, cache tier isolation, failed prerequisite blocking, assignment/verdict/ledger/certificate invariance]
    deliverables: [F1-F4 fixes, negative regressions, section-12 report]
    validation: [scoped comparison/parallel/runtime tests, script tests, public freeze tests]
    stop_conditions: [prior barriers not passed, public change required, exact path list expansion, pilot/campaign/24h request]
    completion_report: runbook section 12

  - task_id: OSC-5-C-AUTHORITY-FOLLOWUP
    role: runtime
    mode: implementation_after_root_counterexample_and_cr_acceptance
    objective: >-
      Close the Runtime consumer half of OSC-4-B-F1 by rejecting self-asserted
      source/universe evidence and separating complete authoritative gate reports
      from subset/custom evaluations.
    required_inputs:
      - experiments/osc_v1/coordination_20260719_v1/phase4_review_reports.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_change_requests.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_prewrite_declarations.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_search_barrier.yaml
      - src/datadiff_osc/public_api_freeze.json
      - Root and Runtime fake-universe counterexample for CR-OSC-5-004
    allowed_write_paths:
      - src/datadiff_osc/runtime/gate_artifacts.py
      - src/datadiff_osc/runtime/gates.py
      - scripts/osc/calculate_gate_report.py
      - tests/osc/test_runtime_gate_artifacts.py
      - tests/osc/test_runtime_gates.py
      - tests/osc/test_runtime_scripts.py
    forbidden_write_paths:
      - src/datadiff_osc/_canonical.py
      - src/datadiff_osc/schemas.py
      - src/datadiff_osc/api.py
      - src/datadiff_osc/public_api_freeze.json
      - src/datadiff_osc/contract_engine/**
      - src/datadiff_osc/semantic_targets/**
      - src/datadiff_osc/generation/**
      - src/datadiff_osc/search/**
      - src/datadiff_osc/scheduler/**
      - src/datadiff_osc/comparison/**
      - src/datadiff_osc/parallel/**
      - src/datadiff/**
      - formal launcher and preregistration paths
    frozen_interfaces:
      - osc-public-api-freeze-v1@cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
      - CR-OSC-5-004 accepted semantics
      - complete default 41-gate thresholds and twenty_four_hour_run_authorized=false
    required_invariants:
      - expected source authority is supplied independently and matches plan, manifest and every raw artifact
      - every COUNT_UNIQUE denominator binds an exact independently frozen identity universe and provenance
      - every COUNT_UNIQUE numerator identity is a subset of its trusted denominator universe
      - exact artifact set, identities, schemas and hashes match the independently frozen authority plan
      - authoritative calculate_gate_report always evaluates the complete default 41-gate spec set
      - custom or subset evaluation has a distinct non-authoritative report and never sets all_gates_pass or authority eligibility
      - no runtime object or script authorizes pilot, 2h or 24h
    deliverables:
      - verified GateAuthorityPlan consumer and source/universe/artifact rebinding checks
      - authoritative/evaluation-only API separation
      - fake-universe, source, plan, artifact, provenance, subset and full-set regression tests
      - complete runbook section-12 follow-up report
    validation:
      - command: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/osc/test_runtime_gate_artifacts.py tests/osc/test_runtime_gates.py tests/osc/test_runtime_scripts.py
        expected: exit 0 and all CR-OSC-5-004 counterexamples fail closed
      - command: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/osc/test_comparison_*.py tests/osc/test_parallel_*.py tests/osc/test_runtime_*.py tests/osc/test_public_api_freeze.py
        expected: exit 0 and public freeze hash unchanged
    stop_conditions:
      - trusted plan would be derived from the caller-authored raw manifest rather than an independent root producer
      - any public frozen field, type, order, schema version or manifest change
      - any write outside the six exact approved paths
      - any weakening of a denominator, threshold, reducer or complete gate set
      - any pilot, campaign, 2h or 24h execution
    completion_report: runbook section 12 with the original fake-universe reproduction shown red then green

  - task_id: OSC-5-ROOT-003-DESIGN-REVIEW
    role: reviewer
    mode: read_only_review_parallel_with_disjoint_runtime_writer
    objective: >-
      Design the minimal Root-owned legacy BackendResult/NormalizedResult to OSC
      Endpoint, Observation and StructuredExecutionOutcome facade with an explicit
      non-legacy authority boundary and lossless failure taxonomy.
    required_inputs:
      - docs/codex_multi_agent_development_runbook.md
      - docs/project_architecture.md
      - docs/semantic_hypercontract_architecture.md
      - experiments/osc_v1/coordination_20260719_v1/phase1_contract_audit.md
      - experiments/osc_v1/coordination_20260719_v1/phase1_runtime_audit.md
      - experiments/osc_v1/coordination_20260719_v1/phase1_dependency_dag.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_change_requests.yaml
      - src/datadiff_osc/public_api_freeze.json
      - current legacy BackendResult, normalization, execution and oracle paths
    allowed_write_paths: []
    forbidden_write_paths: ["**"]
    frozen_interfaces:
      - osc-public-api-freeze-v1@cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
      - CR-OSC-ROOT-003
      - four-valued contract verdict and seven-valued structured execution status
    required_invariants:
      - legacy v1 remains a compatibility payload only and never owns OSC verdict authority
      - unsupported requires independently validated capability evidence
      - timeout, crash, adapter error, semantic domain error and missing remain distinct and never become pass
      - OK observations preserve lossless typed values, multiplicity, order and endpoint scope
      - facade must not infer failure class or semantic permission from root/family/backend/error-message substrings
      - no production launcher, campaign, pilot, 2h or 24h execution
    deliverables:
      - exact current-path evidence and counterexamples
      - proposed Root-owned source/test paths and signatures
      - explicit authority/non-authority data-flow boundary
      - migration risks and negative integration tests
      - runbook section-12 report with changed_files empty
    validation:
      - command: read-only rg/file inspection and optional bounded existing tests only
        expected: zero repository writes
    stop_conditions:
      - any action would write a repository file
      - any proposed public freeze change or legacy verdict authorization
      - any pilot, campaign, 2h or 24h execution
    completion_report: runbook section 12, read-only

  - task_id: OSC-5-ROOT-004-UNIVERSE-REVIEW
    role: reviewer
    mode: read_only_review_parallel_with_disjoint_runtime_writer
    objective: >-
      Map every denominator and artifact in the complete 41-gate set to an
      independently recomputable trusted producer, exact identity universe and
      provenance source for the Root half of CR-OSC-ROOT-004/CR-OSC-5-004.
    required_inputs:
      - docs/codex_multi_agent_development_runbook.md
      - docs/fine_grained_discovery_architecture.md
      - docs/discovery_search_and_parallel_architecture.md
      - docs/semantic_hypercontract_architecture.md
      - experiments/final_bug_discovery_protocol_v3/TODO.md
      - experiments/osc_v1/coordination_20260719_v1/phase1_dependency_dag.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_change_requests.yaml
      - src/datadiff_osc/runtime/gates.py
      - current target compiler/universe, ledger, scheduler, benchmark and v3 plan paths
    allowed_write_paths: []
    forbidden_write_paths: ["**"]
    frozen_interfaces:
      - complete default 41-gate thresholds
      - compiled fresh 16/232, regression 9/144, fresh 384 edges and fresh 502 obligations
      - CR-OSC-5-004 Runtime consumer semantics
      - twenty_four_hour_run_authorized=false
    required_invariants:
      - 232, 384 and 502 identities derive from declarations/compiler output, never numeric constants or self-declared gate records
      - observed numerators derive from admitted ledger/certificate/outcome evidence
      - dynamic run/test/recheck denominators derive from frozen plans and exact case/test identities
      - performance scalars retain raw sample identities and paired provenance
      - synthetic scripts are Phase-6-ineligible
      - missing producer is reported missing, never replaced with an invented plan claim
      - no pilot, campaign, 2h or 24h execution
    deliverables:
      - 41-gate numerator/denominator/reducer/producer/identity/provenance matrix
      - exact existing reusable paths and missing Root producer/glue paths
      - plan-construction and preflight signature proposal that never trusts raw-manifest self-claims
      - required negative and integration tests
      - runbook section-12 report with changed_files empty
    validation:
      - command: read-only source/artifact inspection and bounded import/count checks only
        expected: zero repository writes and independently recomputed 16/232, 9/144, 384 and 502 counts
    stop_conditions:
      - any action would write a repository file
      - any temptation to invent missing Phase 6 evidence or lower a gate
      - any pilot, campaign, 2h or 24h execution
    completion_report: runbook section 12, read-only

  - task_id: OSC-5-ROOT-OBSERVATION-AUTHORITY
    role: root
    mode: shared_binding_integration_serial_after_search_writer_stops
    objective: Bind every compiled cell/edge observation policy to a trusted, endpoint-scoped HyperContract and give the five probe predicates distinct versioned witness_false plugins.
    required_inputs:
      - experiments/osc_v1/coordination_20260719_v1/phase4_review_reports.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_change_requests.yaml
      - Search Agent read-only canonical-binding counterexample
      - docs/fine_grained_discovery_architecture.md
      - docs/semantic_hypercontract_architecture.md
      - src/datadiff_osc/public_api_freeze.json
    allowed_write_paths:
      - src/datadiff_osc/probe_contracts.py
      - src/datadiff_osc/semantic_targets/compiler.py
      - tests/osc/test_probe_contract_integration.py
    forbidden_write_paths: [contract_engine, generation, search, scheduler, comparison, parallel, runtime, legacy, public freeze, launcher]
    frozen_interfaces:
      - osc-public-api-freeze-v1@cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
      - TargetCell/ContrastEdge/BackendPairObligation existing observation_contract string fields
    required_invariants:
      - observation policy IDs are recomputable and unique per complete cell/edge semantic identity
      - caller-supplied digest strings never establish authority
      - exact target/control backend roles bind to the cell extraction source and original Endpoint scope
      - edge authority requires both directional contexts and declared pairs for both cells
      - probe predicates use versioned trusted witness_false plugins and missing plugins fail closed
      - no family-specific runtime evaluator or denominator change
    deliverables:
      - trusted policy registry and HyperContract materializer
      - compiler routing for unique cell and directional edge policy IDs
      - negative integration regressions for collapse, missing plugins, backend/case rebinding and incomplete edge context
    validation:
      - command: PYTHONDONTWRITEBYTECODE=1 .venv/bin/pytest -q -p no:cacheprovider tests/osc/test_probe_contract_integration.py tests/osc/test_targets_compiler_properties.py tests/osc/test_public_api_freeze.py
        expected: exit 0; 232/384/502 unchanged; all policy and rebinding negatives fail closed
    stop_conditions:
      - any frozen field, type, order, schema version, or manifest change
      - any need to relax a relation, backend role, endpoint scope, or denominator
      - any unresolvable non-probe monotonic edge policy
      - any pilot, campaign, or 24h execution
    completion_report: root barrier artifact before Search follow-up release

  - task_id: OSC-5-C-BINDING-FOLLOWUP
    role: runtime
    mode: implementation_serial_after_authority_followup_root_verification
    objective: >-
      Close Root's accepted OSC-4-B-F2 and OSC-4-B-F4 counterexamples by making
      cache exactness request-authoritative and making workers=1/N audit labels
      cryptographically and structurally match the executions that produced them.
    required_inputs:
      - experiments/osc_v1/coordination_20260719_v1/phase4_review_reports.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_change_requests.yaml
      - experiments/osc_v1/coordination_20260719_v1/phase5_search_barrier.yaml
      - completed OSC-5-C-AUTHORITY-FOLLOWUP and Root 32/97-test verification
      - Root force_exact, stage-lie, endpoint-replacement, one-worker and duplicate-run counterexamples
      - src/datadiff_osc/public_api_freeze.json
    allowed_write_paths:
      - src/datadiff_osc/comparison/cache.py
      - src/datadiff_osc/parallel/executor.py
      - src/datadiff_osc/parallel/invariance.py
      - src/datadiff_osc/runtime/benchmarks.py
      - scripts/osc/audit_parallel_invariance.py
      - scripts/osc/benchmark_parallel_scaling.py
      - tests/osc/test_comparison_cache.py
      - tests/osc/test_parallel_executor.py
      - tests/osc/test_parallel_invariance.py
      - tests/osc/test_runtime_benchmarks.py
      - tests/osc/test_runtime_scripts.py
    forbidden_write_paths:
      - src/datadiff_osc/_canonical.py
      - src/datadiff_osc/schemas.py
      - src/datadiff_osc/api.py
      - src/datadiff_osc/public_api_freeze.json
      - src/datadiff_osc/contract_engine/**
      - src/datadiff_osc/semantic_targets/**
      - src/datadiff_osc/generation/**
      - src/datadiff_osc/search/**
      - src/datadiff_osc/scheduler/**
      - src/datadiff_osc/runtime/gate_artifacts.py
      - src/datadiff_osc/runtime/gates.py
      - src/datadiff/**
      - formal launcher and preregistration paths
    frozen_interfaces:
      - osc-public-api-freeze-v1@cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
      - StagedComparisonRequest.exact_required semantics
      - ComparisonStage.S3_EXACT_MATERIALIZED exact authority stage
      - synthetic scripts remain Phase-6-ineligible
    required_invariants:
      - cache exact requirement is request.exact_required, including SCREENING plus force_exact
      - exact-required values are typed StagedComparisonResult objects with exact_escalated true and S3_EXACT_MATERIALIZED stage
      - typed result stage/flag, evidence tier, schema version, request digest and endpoint_order exactly match the request
      - every get boundary independently revalidates the stored value and its complete binding
      - ExecutionRun records the actual positive DeterministicTaskExecutor.max_workers and changes its internal schema version
      - AuthorityEvidenceSnapshot explicitly binds the run worker count and changes its internal schema version
      - audit worker counts are distinct, contain a baseline 1 and at least one N greater than 1, and exactly match each run
      - benchmark validation occurs before any executor invocation; scripts reject invalid lists rather than emitting passing reports
      - one-count and duplicate workers=1-as-6 counterexamples fail closed
      - no pilot, campaign, 2h or 24h execution
    deliverables:
      - bidirectional cache request/result exact-stage binding
      - run and authority-snapshot worker-count provenance with versioned internal schemas
      - non-vacuous invariance-design validation shared by direct audit and benchmark paths
      - negative regressions for every Root counterexample and CLI invalid designs
      - runbook section-12 completion report
    validation:
      - command: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/osc/test_comparison_cache.py tests/osc/test_parallel_executor.py tests/osc/test_parallel_invariance.py tests/osc/test_runtime_benchmarks.py tests/osc/test_runtime_scripts.py
        expected: exit 0 and all F2/F4 counterexamples fail closed
      - command: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/osc/test_comparison_*.py tests/osc/test_parallel_*.py tests/osc/test_runtime_*.py tests/osc/test_public_api_freeze.py
        expected: exit 0 and public freeze hash unchanged
    stop_conditions:
      - any public frozen field, type, order, schema version or manifest change
      - any write outside the eleven exact approved paths
      - any cache rule that lets request.exact_required return non-exact evidence
      - any audit path that trusts worker-count labels without run provenance
      - any pilot, campaign, 2h or 24h execution
    completion_report: runbook section 12 with all five Root counterexamples shown red then green

  - task_id: OSC-5-A-OUTCOME-ADMISSION
    role: contract
    mode: implementation_serial_after_runtime_owner_barrier
    objective: >-
      Implement the Contract-owned half of CR-OSC-ROOT-003-A so no staged
      screening or applicability early return can bypass independent structured
      execution-outcome binding.
    required_inputs:
      - docs/codex_multi_agent_development_runbook.md
      - experiments/osc_v1/coordination_20260719_v1/phase5_change_requests.yaml
      - OSC-5-ROOT-003-DESIGN-REVIEW and its read-only appendix
      - existing execution_outcome_binding_errors and original Endpoint authority
      - src/datadiff_osc/public_api_freeze.json
    allowed_write_paths:
      - src/datadiff_osc/contract_engine/planner.py
      - tests/osc/test_contract_relations_planner.py
      - tests/osc/test_contract_authority.py
    forbidden_write_paths:
      - src/datadiff_osc/contract_engine/model.py
      - src/datadiff_osc/contract_engine/monitor.py
      - src/datadiff_osc/schemas.py
      - src/datadiff_osc/api.py
      - src/datadiff_osc/public_api_freeze.json
      - src/datadiff_osc/comparison/**
      - src/datadiff_osc/semantic_targets/**
      - src/datadiff_osc/generation/**
      - src/datadiff_osc/search/**
      - src/datadiff_osc/scheduler/**
      - src/datadiff_osc/parallel/**
      - src/datadiff_osc/runtime/**
      - scripts/**
      - src/datadiff/**
      - formal launcher and preregistration paths
    frozen_interfaces:
