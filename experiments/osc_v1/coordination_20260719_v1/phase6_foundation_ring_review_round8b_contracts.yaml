global_requirements:
  - >-
    Every reviewer reads the runbook, project architecture, assigned authority, this contract,
    and assigned target files to EOF. Verify entry authority and assigned target SHA before and
    after the exactly-once scoped pytest. Stop on a true current-authority or target mismatch.
  - >-
    Read-only 负向复核、独立反例验证、异常输入验证 only. Each report must state writes=0,
    child_agents=0, forbidden_paths_modified=[], and deviations=[] unless a real deviation occurs.
  - >-
    Every Python command uses PYTHONDONTWRITEBYTECODE=1. No tests/osc directory suite,
    repository suite, parity-100000, v3-2200, Phase 7, 2h, or 24h command is authorized.
  - >-
    Each reviewer may execute only its stated scoped pytest exactly once. Search must retain the
    original terminal session to exit and include the exact exit code plus complete result.
  - >-
    No public exports, public_api_freeze.json, frozen targets, thresholds, denominators,
    comparator semantics, replay authority, provenance origin, admission authority, or execution
    authorization may change. Diagnostic refs remain diagnostic-only; missing exact typed context
    fails closed/not_evaluated; candidate remains non-confirmed and bug_claimed=false.
  - >-
    Neither a report nor this contract grants foundation pass, candidate confirmation, gate credit,
    combined-suite authorization, Phase 7, 2h, or 24h authorization.
