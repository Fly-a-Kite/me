root_policy:
  - do not invent a threshold or silently select an effect test
  - do not lower any current threshold
  - do not treat a diagnostic scalar as a raw paired observation
  - every denominator is an exact typed identity set derived from declarations or an approved corpus
  - zero-valued failure series require a complete bound denominator rather than omission
  - any spec-set change requires a new expected digest in Root authority plus negative regression tests
next_barriers:
  - private foundation implementation round passes scoped tests and exact-path review
  - Root freezes all missing numeric definitions and resolves qualitative blockers
  - raw producer schemas and record-ID cross-bindings are complete
  - only then update the frozen spec set and its Root authority digest
