required_invariants:
  - >-
    Exactly seven HTTPS GET requests are permitted, one to each declared
    https://pypi.org/pypi/<distribution>/json endpoint, with default TLS
    validation, a 15-second timeout, no redirect, no credential, no upload, and
    at most 10 MiB raw response bytes per endpoint. All bytes are fetched and
    validated in memory before any durable output is created.
  - >-
    Each raw response must be valid UTF-8 JSON with exactly a nonempty
    info.name and info.version value. The audit binds its exact endpoint, raw
    byte SHA-256, returned public distribution name, returned latest version,
    frozen installed/locked version, and match result; it must not substitute a
    caller-provided version string for public bytes.
  - >-
    The public source audit must cross-bind the verified snapshot SHA/source
    digest and local environment-audit SHA. A public/installed mismatch is a
    valid recorded audit outcome but leaves formal execution unauthorized and
    all Phase-6 gates pending.
  - >-
    The output-layout manifest must be canonical JSON and predeclare the
    absent formal_evidence root, the exact 10 producer raw/receipt locations,
    dynamic-plan path, receipt-index path, authority-plan path, artifact
    manifest path, gate-report path, seed exclusions, no-overwrite rule, and
    no-output-without-a-successor-contract rule. It must not create the
    formal_evidence root or any listed child path.
  - >-
    The two external roots are write-once: both must be absent before the one
    command, contain exactly the nine authorized files after it, and never be
    overwritten or regenerated by this task.
  - >-
    No TargetVersionReceipt, target-version producer receipt, raw execution
    artifact, dynamic plan, receipt index, formal gate bundle, candidate
    confirmation, or bug claim is created from this audit or layout manifest.
negative_review_requirements:
  负向复核:
    - malformed public JSON, missing info.name/info.version, wrong endpoint scheme/host, and a substituted raw SHA must fail closed
    - layout path escape and an attempt to create a formal_evidence child must fail closed before durable write
  独立反例验证:
    - >-
      Seven official response bytes and an output layout alone cannot become a
      TargetVersionReceipt, receipt-index entry, dynamic plan, or gate credit.
  异常输入验证:
    - >-
      redirect, non-200/oversized response, response identity mismatch,
      preexisting output, source/audit drift, package mismatch, output inventory
      mismatch, network count breach, or noncanonical audit/layout stops the task.
