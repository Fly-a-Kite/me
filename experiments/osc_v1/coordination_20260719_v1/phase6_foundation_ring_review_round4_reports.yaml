    findings:
      - id: OSC-6-FOUNDATION-SEARCH-R4-H1
        severity: high
        claim: >-
          application-policy callable identity is static-only. Cloning
          TargetPreservingMutator.mutate with identical code/source/module/qualname
          while replacing its MutationOutcome global leaves the policy ID unchanged;
          a rejected outcome with attempts=1 is then accepted under the prior policy ID.
        evidence:
          path: src/datadiff_osc/search/context_receipts.py
          symbol_or_line: _policy_callable_implementation_digest lines 1639-1648; mutation_operator_application_policy_id lines 1845-1863
        reproduction: >-
          独立反例验证：克隆 TargetPreservingMutator.mutate，仅将其 globals 中的
          MutationOutcome 替换为把 attempts 固定为 1 的构造器；基线与替换均为
          rejected，但 policy ID 不变且 MutationAttemptReceipt.build 接受替换 outcome。
        violated_invariant: >-
          application-policy callable 必须绑定完整 live context；任何影响行为的
          globals/defaults/kwdefaults/closure/递归依赖替换不得沿用旧 policy identity。
        minimal_fix_owner: search
        required_test: >-
          增加 cold/warm MutationOutcome-global 替换和 prior-ID replacement-outcome
          回归；每种替换必须在 replay 前 fail closed。
      - id: OSC-6-FOUNDATION-SEARCH-R4-H2
        severity: high
        claim: >-
          module/class attribute path binds only the terminal descriptor. Replacing
          Holder.STATE or module.STATE changes STATE.get behavior while the callable
          digest remains unchanged; mutable and cyclic intermediate owners also pass.
        evidence:
          path: src/datadiff_osc/search/context_receipts.py
          symbol_or_line: _resolve_attribute_path lines 1024-1037; _live_context_digest module/class terminal binding
        reproduction: >-
          独立反例验证：分别调用 Holder.STATE.get 与 module.STATE.get，替换 STATE 后
          terminal digest 不变而返回值改变；异常输入验证显示 mutable/cyclic 中间 owner
          被接受。
        violated_invariant: >-
          attribute path 必须绑定每个中间 owner；mutable、cyclic、unresolved 或
          uninspectable owner 必须 fail closed。
        minimal_fix_owner: search
        required_test: >-
          增加 module/class 中间 owner 替换、mutable/cyclic fail-closed，以及
          unresolved/uninspectable fail-closed 回归。
