task:
  task_id: OSC-6-CONTRACT-COMPARISON-ROOT-BINDING-R2
  objective: >-
    Bind every admissible private ContractComparisonReceipt to one exact
    dynamic-plan comparison-decision record using the current verified source,
    canonical envelope bytes, Contract-owned reconstruction, and the trusted
    contract_exact_replay producer receipt. This is evidence plumbing only;
    it cannot itself make a denominator authoritative or a gate publishable.
  allowed_write_paths:
    - src/datadiff_osc/_phase6_gate_authority.py
    - src/datadiff_osc/contract_engine/replay.py
    - tests/osc/test_contract_phase6_comparison_receipts.py
    - tests/osc/test_contract_semantic_replay.py
    - tests/osc/test_phase6_gate_authority_integration.py
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_comparison_root_binding_task_contract.yaml
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_comparison_root_binding_report.yaml
    - experiments/osc_v1/coordination_20260719_v1/coordination_ledger.yaml
  forbidden_write_paths:
    - src/datadiff_osc/__init__.py
    - src/datadiff_osc/public_api_freeze.json
    - src/datadiff_osc/search/**
    - src/datadiff_osc/runtime/**
    - src/datadiff_osc/contract_engine/_phase6_comparison_receipts.py
    - src/datadiff_osc/contract_engine/_phase6_corpora.py
    - src/datadiff_osc/contract_engine/gates.py
    - src/datadiff_osc/contract_engine/model.py
    - src/datadiff_osc/contract_engine/evidence.py
    - src/datadiff_osc/contract_engine/planner.py
    - tests/osc/test_contract_phase6_corpora.py
    - tests/osc/test_search_context_receipts.py
    - tests/osc/test_search_gate_crosswalk.py
    - tests/osc/test_search_lane_registry.py
    - tests/osc/test_runtime_receipt_producers.py
    - tests/osc/test_runtime_producer_provenance.py
    - docs/**
    - scripts/**
  read_only_dependencies:
    - src/datadiff_osc/contract_engine/_phase6_comparison_receipts.py
    - src/datadiff_osc/contract_engine/model.py
    - src/datadiff_osc/contract_engine/evidence.py
    - src/datadiff_osc/contract_engine/planner.py
    - src/datadiff_osc/runtime/gates.py
    - src/datadiff_osc/runtime/gate_artifacts.py
  frozen_interfaces:
    - osc-public-api-freeze-v1:cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
    - osc-pre24-gate-spec-set-d9792996cacb6fc6e47bce602d5f7ab6d6382c62ba9e1ac6bc1f8003ecbec552
    - all thirteen frozen_target_sha256 entries above
  required_invariants:
    - >-
      The dynamic plan advances to a new private schema version and rejects
      every old plan fail closed. It replaces the unbound staged-parity
      denominator record with a contract_comparison_decisions record keyed by
      the derived comparison_decision_id; no automatic v1 migration or
      count-only substitute is allowed.
    - >-
      Each dynamic comparison record contains only exact derived bindings:
      comparison decision, source snapshot and case, ResultGroup and contract
      fingerprint, ordered endpoint set, fingerprint/exact task IDs and result
      digests, and separately domain-tagged derived fingerprint and canonical
      partition digests, plus the producer receipt digest. Root recomputes all
      of them; caller-authored IDs, booleans, partitions, equality claims, or
      digest-only objects never establish a binding.
    - >-
      Before Root compares a dynamic record, it must re-read and re-hash the
      admitted envelope, verify its canonical type/version/envelope digest, and
      invoke one Contract-owned private reconstruction/round-trip helper for
      ContractComparisonReceipt. Root must not duplicate or weaken Contract
      parsing and must reject stale bytes, malformed payloads, old schemas,
      wrong type, wrong source, wrong case, wrong group, wrong contract,
      endpoint substitution/order changes, task/result substitutions, and
      partition substitutions fail closed.
    - >-
      The contract_exact_replay producer must have exactly one canonical
      ContractComparisonReceipt admission per derived decision ID. Duplicate
      admission IDs, duplicate decision IDs, a non-comparison envelope, a
      mismatched subject, or a record lacking the exact producer receipt digest
      is a Root binding failure before a denominator can contribute to a gate.
    - >-
      contract_comparison_decision_ids may leave the R1 context-pending map
      only because Root now performs the exact cross-object binding above.
      Legacy ResultGroup staged_parity_groups remains context-pending. A valid
      isolated receipt, an incomplete plan, or any collision/mismatch fixture
      remains non-publishable; no raw staged_exact_discrepancies metric is
      accepted or synthesized in this task.
    - >-
      The existing private receipt schema stays private and unchanged, the
      Contract replay owner remains unique, no public export is added, and no
      public freeze/gate-spec/raw-metric/producer/runtime behavior changes.
    - >-
      Diagnostic refs remain permanently diagnostic-only. Every fixture keeps
      candidates non-confirmed and bug_claimed=false; missing exact typed
      context is fail-closed/not_evaluated and cannot promote a candidate.
  required_tests:
    负向复核:
      - >-
        Mutate one dynamic record field at a time for source, case,
        ResultGroup, contract fingerprint, endpoint-set, fingerprint/exact
        task, fingerprint/exact result, partition digest, or producer digest;
        assert Root reports the first exact cross-object binding failure and
        never produces a publishable bundle.
      - >-
        Demonstrate old dynamic-plan schema, post-admission envelope byte
        changes, malformed/wrong-type receipt envelopes, duplicate admissions,
        and duplicate decision identities all fail closed before denominator or
        gate acceptance.
    独立反例验证:
      - >-
        Build one real canonical ContractComparisonReceipt admission and its
        exact dynamic record, then show that same-cardinality endpoint/group or
        task/result substitutes cannot bind to the original record. Confirm a
        fingerprint collision with unequal canonical values is retained only
        as non-publishable failure evidence, never as a pass claim.
    异常输入验证:
      - >-
        Reject missing/extra record fields, malformed digest formats,
        unordered/duplicate records, stale source digest, unsupported schema,
        unreadable envelope, and canonical round-trip failures without throws,
        publication, candidate confirmation, or bug claim.
  scoped_validation:
    command: >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      tests/osc/test_contract_phase6_comparison_receipts.py
      tests/osc/test_contract_semantic_replay.py
      tests/osc/test_phase6_gate_authority_integration.py
    timing: exactly once, only after all allowed implementation writes and SHA checks
    forbidden_substitutes:
      - tests/osc
      - repository suite
      - six-file combined suite
      - 100000 parity execution
      - v3 2200
      - Phase 7
      - 2h pilot
      - 24h run
  completion_requirements:
    - reverify every allowed product path and all thirteen frozen/public SHA values before the scoped suite
    - retain complete command, exit code, and terminal result in the report
    - reverify every allowed product path and all thirteen frozen/public SHA values after the scoped suite
    - use apply_patch for report and ledger only after the real terminal result is known
    - retain phase_6_contract as pending regardless of scoped-suite outcome
  stop_conditions:
    - any frozen/public SHA mismatch, staged user path, pre-existing report path, or scope expansion
    - any need to modify a public export, gate spec, raw metric reducer, paired benchmark receipt, runtime producer, frozen target, docs, or script
    - any accepted unbound receipt, caller-authored identity/equality/partition, source rebind, count-only proof, publishable bundle, gate pass, candidate confirmation, or bug_claimed=true
    - failed scoped suite or incomplete terminal test evidence
