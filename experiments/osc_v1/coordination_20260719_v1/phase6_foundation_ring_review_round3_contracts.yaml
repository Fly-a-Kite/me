report_requirements:
  - exact reviewed target SHA set plus entry report, remediation contract, R2 review, runbook, architecture and public freeze SHA
  - writes=0, child_agents=0, forbidden_paths_modified=[] and deviations=[]
  - exact scoped command, exit code and result
  - each prior finding and required R2 counterexample disposition
  - every new attack attempted with the exact accepted/rejected/error result
  - each new finding follows the runbook schema with severity, claim, evidence path and symbol/line, reproduction, violated invariant, minimal fix owner and required test
  - blocker, high, medium and low counts plus explicit pass or fail; no conditional pass
exit:
