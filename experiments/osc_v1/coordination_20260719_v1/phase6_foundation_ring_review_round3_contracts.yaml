global_requirements:
  - hash every entry artifact and every assigned target before semantic inspection or tests; any mismatch stops that review
  - inspect implementation and tests for correctness, soundness, reproducibility, authority boundaries and missing negative tests; style findings are out of scope
  - independently rerun every R2 counterexample assigned below and add at least two distinct bounded attacks against adjacent trust boundaries
  - typed reconstruction must rebuild the real declared type, rerun its invariants and recompute identities from causal inputs rather than caller summaries or matching digests
  - unknown, malformed, incomplete, aggregate, relabeled, swapped, nondeterministic or caller-authored evidence fails closed or remains context-missing/not_evaluated
  - diagnostic refs remain diagnostic-only and never affect admission, coverage, evidence, candidates, bugs, gates, Phase 7 or 24h authority
  - candidate remains candidate; confirmed bug states and bug_claimed true remain rejected or unrepresentable
  - no contract, threshold, denominator, comparator, public export or public API freeze weakening is permitted
  - report blocker, high, medium and low separately; pass requires blocker=0, high=0 and medium=0
  - use PYTHONDONTWRITEBYTECODE=1 for every Python command and run only the assigned scoped test command
  - do not run tests/osc, the full repository suite, parity 100000, v3 2200, a 2h pilot or 24h
