required_invariants:
  - >-
    Resolve one exact Git repository root and bind only its HEAD plus the full
    porcelain-v1 -z status bytes with untracked-files=all. A supplied nested
    directory, non-Git path, command failure, malformed status, or root
    substitution fails closed.
  - >-
    Clean means exact empty full status bytes. Any tracked, staged, renamed,
    ignored-visible, or untracked status bytes make clean_input_eligible=false.
    The result must retain an exact status SHA and reject digest/state mutation.
  - >-
    authority_eligible=false, gate_credit=false, raw_artifact_admitted=false,
    coverage_event_created=false, candidate_confirmed=false, and
    bug_claimed=false unconditionally, including for a clean temporary test
    repository. A clean classification is not a captured source snapshot.
  - >-
    The implementation must not import or modify the root gate-authority
    bundle, source_snapshot_payload, ledger, producer provenance, public API,
    or any launcher. It must not create a source snapshot, clean worktree,
    commit, staged change, persistent file, raw artifact, or network request.
  - >-
    The only Git mutations permitted are entirely inside pytest tmp_path test
    repositories created by the test itself; no command may mutate the shared
    workspace Git repository.
negative_review_requirements:
  负向复核:
    - nested-root, non-Git, dirty tracked, dirty untracked, and status digest substitutions
  独立反例验证:
    - a clean temporary Git repository is only clean_input_eligible and never source/authority/gate eligible
  异常输入验证:
    - unavailable Git executable, malformed command result, NUL/status corruption, and typed-record mutation fail closed
