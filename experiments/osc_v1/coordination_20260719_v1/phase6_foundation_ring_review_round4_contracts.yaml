  - no threshold, denominator, comparator, public export or public API freeze change is permitted
  - pass requires blocker=0, high=0 and medium=0; report low separately
  - use PYTHONDONTWRITEBYTECODE=1 for every Python command and run only the assigned scoped command
  - do not run tests/osc, full repository, parity 100000, v3 2200, Phase 7, 2h or 24h
