task:
  task_id: OSC-6-CONTRACT-EXECUTION-PROVENANCE-RAW-ARTIFACT-BOUNDARY-R8
  objective: >-
    Freeze the minimal independent Root-owned execution-provenance and
    raw-artifact producer boundary required before future artifact admission
    can be considered. Map the existing source-snapshot, dynamic-plan,
    typed-receipt-index, raw-artifact, manifest, and R7 private-proof seams;
    identify the required acyclic construction order and exact future
    implementation surface. This task creates no product object and no real
    evidence.
  allowed_write_paths:
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_execution_provenance_raw_artifact_boundary_task_contract.yaml
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_execution_provenance_raw_artifact_boundary_report.yaml
    - experiments/osc_v1/coordination_20260719_v1/coordination_ledger.yaml
  forbidden_write_paths:
    - src/**
    - tests/**
    - scripts/**
    - docs/**
    - experiments/final_bug_discovery_protocol_v3/**
    - src/datadiff_osc/public_api_freeze.json
    - src/datadiff_osc/search/context_replay.py
    - tests/osc/test_search_gate_crosswalk.py
    - src/datadiff_osc/search/lane_registry.py
    - tests/osc/test_search_lane_registry.py
    - src/datadiff_osc/runtime/_receipt_producers.py
    - tests/osc/test_runtime_receipt_producers.py
    - src/datadiff_osc/runtime/_producer_provenance.py
    - tests/osc/test_runtime_producer_provenance.py
    - src/datadiff_osc/contract_engine/_phase6_corpora.py
    - tests/osc/test_contract_phase6_corpora.py
  frozen_interfaces:
    - osc-public-api-freeze-v1:cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
    - osc-pre24-gate-spec-set-d9792996cacb6fc6e47bce602d5f7ab6d6382c62ba9e1ac6bc1f8003ecbec552
    - all thirteen frozen_target_sha256 entries above
    - R7 ParallelScalingProductionProvenance private proof
  required_invariants:
    - >-
      Future admission requires a Root-owned canonical execution-provenance
      envelope, not a caller-authored digest. It must bind the verified source
      snapshot digest and bytes, exact producer implementation-byte hashes,
      declared command/arguments and an allowlisted environment identity,
      process exit status, immutable stdout/stderr or structured-output byte
      hashes, typed receipt-envelope byte hash, raw-artifact byte hash, and an
      exact producer/admission/artifact identity tuple. Every field must be
      re-readable and re-derived before Root retains evidence.
    - >-
      Construction is acyclic: independently capture a verified source
      snapshot; create typed execution output and its private Root-verifiable
      provenance; derive producer receipts; bind their digest into the dynamic
      plan; create raw artifacts and the receipt index using that plan hash;
      only then build an unpublished Root authority payload and, under a later
      authority, an externally hashed manifest. No output may self-authorize
      an earlier step, and no index, manifest, receipt, or digest may substitute
      for a real process record.
    - >-
      A source snapshot remains valid only while its exact source-byte and Git
      status binding verifies. An execution producer must capture it before the
      measured process and reject post-capture source/status change; a later
      artifact cannot be rebound to a changed snapshot, dynamic plan, producer
      receipt, or raw-artifact byte string.
    - >-
      The existing RawMetricSeries artifact schema may transport canonical raw
      metric records only after a future producer proves their execution origin.
      A fixture, word scan, scalar aggregate, synthetic label, same-cardinality
      substitute, or opaque provenance digest is permanently insufficient for
      real execution evidence.
    - >-
      R7's ParallelScalingProductionProvenance stays a private exact-pairing
      proof. It is one input to a future execution-provenance envelope, not a
      raw artifact, a complete producer set, a cohort/corpus result, a metric,
      or authority to publish.
    - >-
      Diagnostic refs remain permanently diagnostic-only. Missing exact typed
      context is fail-closed/not_evaluated; candidate remains non-confirmed,
      bug_claimed remains false, and no gate/Phase-7/2h/24h authority is
      created.
  required_analysis:
    - >-
      Record why source_snapshot_payload/verify_source_snapshot, the dynamic
      plan, receipt index, and gate-artifact manifest form distinct proof
      layers, and record their exact dependency order.
    - >-
      Map the smallest future implementation surface without authorizing it:
      a private execution-provenance replayer/producer, a private raw-artifact
      producer, Root receipt-index admission checks, and focused unit/integration
      tests. Existing frozen producers and public interfaces remain excluded.
    - >-
      Specify the future negative-review, independent-counterexample, and
      abnormal-input obligations for swapped source/receipt/artifact bindings,
      hash/status/output mutation, nonzero exit, truncated output, duplicate
      identities, path escape, and post-capture source change.
  validation:
    - command: read-only SHA-256 verification for predecessor authority and all thirteen frozen/public targets before and after authority writes
      expected: every frozen/public value remains exact
    - command: git diff --cached --name-only
      expected: zero staged paths
    - command: no product test or execution command
      expected: no scoped suite, corpus, v3, repository test, or artifact producer runs
  completion_requirements:
    - create a root-owned report with the seam crosswalk and acyclic order
    - state explicitly that zero product paths, zero tests, zero source snapshots, and zero raw artifacts were created
    - synchronize ledger while retaining phase_6_contract as pending
    - retain findings without downgrade or concealment
  stop_conditions:
    - any frozen/public SHA mismatch or staged user path
    - any need to edit a product/test path, public export, gate spec, frozen file, docs, or scripts
    - any attempt to treat a fixture as execution evidence, create a source snapshot, run a test/corpus/cohort, calculate metrics, or publish an authority
    - any candidate confirmation, bug_claimed=true, Phase 7, 2h, or 24h implication
