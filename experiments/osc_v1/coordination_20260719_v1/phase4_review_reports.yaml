findings:
  - finding_id: OSC-4-A-F1
    severity: blocker
    claim: CoverageLedger accepts forged activation and placeholder applicability/observation/outcome digests, permitting unsupported, failed, or unexecuted targets to receive observed credit.
    evidence:
      path: src/datadiff_osc/search/ledger.py
      symbol_or_line: CoverageLedger.admit
    reproduction: A valid-looking certificate with the wrong universe fingerprint and empty observed atoms advances one cell through all four levels when arbitrary matching digest strings are supplied.
    violated_invariant: Observed credit must bind valid activation/applicability/observation certificates and OK execution outcomes; unsupported/infeasible work earns no credit.
    minimal_fix_owner: search
    required_test: Reject wrong universe/assignment/atom bindings, placeholder digests, and non-OK outcomes at executed/observed admission.
    status: open
  - finding_id: OSC-4-A-F2
    severity: blocker
    claim: Contrast endpoint atoms are merged without endpoint or direction identity, so swapping monotonic base/sibling produces the same valid activation certificate.
    evidence:
      path: src/datadiff_osc/generation/extraction.py
      symbol_or_line: merge_extractions
    reproduction: Swap both sides of a directional boundary edge; merged extraction and activation certificate digests remain identical and contain no endpoint IDs.
    violated_invariant: All 384 edge endpoints must activate separately and bind endpoint, atoms, seed lineage, and relation direction.
    minimal_fix_owner: search
    required_test: Endpoint swap, cross-endpoint atom borrowing, and one-sided activation must fail, including directional edges.
    status: open
  - finding_id: OSC-4-A-F3
    severity: high
    claim: Fresh provenance validation omits definition.root_id before hashing it, allowing known-root/replay identity into the fresh registry.
    evidence:
      path: src/datadiff_osc/semantic_targets/declarations.py
      symbol_or_line: _legacy_templates_for
    reproduction: Change a coverage-expansion root_id to a known-root/replay marker; fresh compilation still succeeds.
    violated_invariant: Fresh, regression, known-root, and issue-inspired provenance must be physically and semantically separated.
    minimal_fix_owner: search
    required_test: Reject root markers, cross-partition duplicate root identity, and regression provider/evidence in fresh declarations.
    status: open
  - finding_id: OSC-4-A-F4
    severity: high
    claim: Scheduler group identity and denominators are caller supplied; unknown groups default to maximum debt and can shrink or invent max-min groups.
    evidence:
      path: src/datadiff_osc/scheduler/policy.py
      symbol_or_line: ScheduleCandidate, _validate_candidate, _group_debt
    reproduction: An 18-cell family accepts coverage 1/1 and an unknown group outranks an otherwise equal valid candidate.
    violated_invariant: Fixed denominators and max-min groups must be recomputed from the frozen universe and ledger.
    minimal_fix_owner: search
    required_test: Reject unknown groups and incorrect totals/membership; derive denominators only from the universe.
    status: open
  - finding_id: OSC-4-A-F5
    severity: high
    claim: Twenty-four fresh probe cells spanning five probe operations collapse to one generic bag-equality observation digest per family and have no explicit predicate/HyperContract binding.
    evidence:
      path: src/datadiff_osc/semantic_targets/compiler.py
      symbol_or_line: _compile_cells observation_contract
    reproduction: Polars has 12 cells/two probes/one contract and PyArrow 12 cells/three probes/one contract; Contract has no corresponding explicit probe plugin.
    violated_invariant: A probe is admissible only through an explicit lossless predicate; every target must carry a faithful HyperContract.
    minimal_fix_owner: root
    required_test: Each probe resolves to a versioned contract fingerprint; missing plugins fail closed and distinct probe semantics cannot collapse.
    status: open
  - finding_id: OSC-4-B-F1
    severity: blocker
    claim: Gate calculation trusts arbitrary metrics and nonempty evidence strings without artifact existence/hash/schema/source binding or recomputation.
    evidence:
      path: src/datadiff_osc/runtime/gates.py
      symbol_or_line: _calculate_one and GateReport.__post_init__
    reproduction: Threshold-shaped metrics plus 41 nonexistent evidence strings produce all_gates_pass=true and 41/41 passing results.
    violated_invariant: Raw gate evidence must fail closed and be independently recomputable; denominators and coverage cannot be fabricated.
    minimal_fix_owner: runtime
    required_test: Missing/wrong hash/schema/source, metric mismatch, and denominator shrinkage all fail; only verified typed manifests can pass.
    status: open
  - finding_id: OSC-4-B-F2
    severity: high
    claim: RuntimeResultCache does not bind cached values to key endpoint, contract, schema, or evidence tier.
    evidence:
      path: src/datadiff_osc/comparison/cache.py
      symbol_or_line: RuntimeResultCache.get and put
    reproduction: A FINDING key stores and returns a SCREENING non-exact StagedComparisonResult.
    violated_invariant: Screening/finding/fresh/native evidence tiers cannot contaminate each other and every non-screening result is exact.
    minimal_fix_owner: runtime
    required_test: Reject cross-tier, cross-endpoint, cross-contract insertion and revalidate binding on lookup.
    status: open
  - finding_id: OSC-4-B-F3
    severity: high
    claim: The DAG executor schedules descendants after failed prerequisites because dependency outcomes are passed to workers but never gate scheduling.
    evidence:
      path: src/datadiff_osc/parallel/executor.py
      symbol_or_line: DeterministicTaskExecutor._execute_layer
    reproduction: A timeout parent is followed by an invoked OK child in a two-layer DAG.
    violated_invariant: Failed preflight/activation cannot produce backend execution or observed credit.
    minimal_fix_owner: runtime
    required_test: Failed prerequisites block authority descendants and emit auditable INCONCLUSIVE records without executed/observed ledger credit.
    status: open
  - finding_id: OSC-4-B-F4
    severity: high
    claim: Parallel invariance ignores assignment/epoch and does not compare authority verdict, coverage bitmap, ledger, or certificate digests.
    evidence:
      path: src/datadiff_osc/parallel/invariance.py
      symbol_or_line: InvarianceReport and audit_execution_runs
    reproduction: Replacing only assignment_digest still yields passed=true; divergent unbound verdict/ledger state is invisible when payload digests match.
    violated_invariant: Worker/retry/order/cache changes cannot alter assignments, selected task multiset, coverage, authority verdict, or evidence.
    minimal_fix_owner: runtime
    required_test: Assignment/epoch/verdict/ledger/certificate changes each make invariance fail.
    status: open
  - finding_id: OSC-4-C-F1
    severity: blocker
    claim: RelationRegistry.digest omits evaluator identity and authority APIs accept an injected registry, so an evaluator replacement can turn exact VIOLATED into SATISFIED under the same digest.
    evidence:
      path: src/datadiff_osc/contract_engine/relations.py
      symbol_or_line: RelationRegistry.digest and evaluate
    reproduction: Replace bag_equal evaluator with constant SATISFIED while preserving metadata; registry digests remain equal and audit/exact verdict changes.
    violated_invariant: Exact authority and its relation registry/version must be stably contract-bound.
    minimal_fix_owner: contract
    required_test: Same-metadata/different-evaluator registry injection must be rejected by exact and audit paths.
    status: open
  - finding_id: OSC-4-C-F2
    severity: blocker
    claim: ApplicabilityCertificate can be rebound to endpoints outside frozen backend/version/mode/layout scope; monitor observations are not tied to endpoint digests.
    evidence:
      path: src/datadiff_osc/contract_engine/applicability.py
      symbol_or_line: evaluate_applicability, applicability_binding_errors, applicability_contract_binding_errors
    reproduction: Replace satisfied v1 endpoint digests with v2 endpoint digests under a v1-only requirement; binding errors remain empty and equal observations pass.
    violated_invariant: Certificates bind contract, endpoint scope/version, applicability, observation, and provenance end to end.
    minimal_fix_owner: contract
    required_test: Backend/version/mode/layout rebinding each fails closed; request a minimal root interface change only if existing schema cannot bind observations.
    status: open
  - finding_id: OSC-4-C-F3
    severity: high
    claim: partial_order_topk reduces allowed, fixed, and actual rows to sets, losing duplicate multiplicity and accepting repeated fixed rows that displace legal choices.
    evidence:
      path: src/datadiff_osc/contract_engine/relations.py
      symbol_or_line: validate_relation_obligation and _partial_order_topk
    reproduction: For n=2, allowed 1/2/3, fixed 1, output (1,1) is accepted as SATISFIED.
    violated_invariant: Tie freedom cannot relax cardinality, duplicate multiplicity, or admit values outside the legal boundary.
    minimal_fix_owner: contract
    required_test: Fixed-row duplication, multiplicity exhaustion, and legal tie choices use Counter-aware semantics.
    status: open
  - finding_id: OSC-4-C-F4
    severity: high
    claim: Compiling containment injects cardinality_equal through a broad default demand, turning valid strict containment into VIOLATED.
    evidence:
      path: src/datadiff_osc/contract_engine/demand.py
      symbol_or_line: demand_for_relation
    reproduction: Compiled containment of (1) within (1,2) has a satisfied containment component but fails only cardinality_equal.
    violated_invariant: Orthogonal relation components cannot silently rewrite refinement/containment semantics.
    minimal_fix_owner: contract
    required_test: Frozen relation obligation-shape tests prevent contradictory equality obligations.
    status: open
  - finding_id: OSC-4-C-F5
    severity: high
    claim: Explicit status_ok cannot evaluate semantic_error because monitor preclassifies it as a value relation and returns INCONCLUSIVE instead of its defined VIOLATED.
    evidence:
      path: src/datadiff_osc/contract_engine/monitor.py
      symbol_or_line: _ERROR_RELATIONS and non-OK precheck
    reproduction: Registry status_ok returns VIOLATED for semantic_error, while monitor_exact returns INCONCLUSIVE on the same observations.
    violated_invariant: Only explicit relations interpret semantic errors; timeout/crash/adapter/missing remain INCONCLUSIVE.
    minimal_fix_owner: contract
    required_test: Explicit status semantic-error matrix plus ordinary value relation and execution-failure negative cases.
    status: open
  - finding_id: OSC-4-C-F6
    severity: low
    claim: partial_order fingerprint uses raw row sequence, forcing exact escalation for valid tie permutations and weakening performance goals without changing verdict soundness.
    evidence:
      path: src/datadiff_osc/contract_engine/observers.py
      symbol_or_line: observe_component partial_order
    reproduction: Two tie-equivalent endpoint permutations pass exact but always split fingerprints and escalate S3.
    violated_invariant: Fingerprint observers should canonicalize relation-permitted freedom and prove measured savings without altering verdicts.
    minimal_fix_owner: contract
    required_test: Tie-permutation fingerprint test plus Phase 6 raw performance benchmark.
    status: open

