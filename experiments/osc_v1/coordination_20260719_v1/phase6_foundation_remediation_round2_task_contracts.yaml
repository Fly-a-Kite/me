    requirements:
      - >-
        Resolve the selected operator through the frozen
        ALL_MUTATION_OPERATOR_PROFILES registry, verify its exact implementation
        digest, and deterministically apply that exact operator to an isolated
        reconstruction of the exact source Case using the derived MUTATION seed.
      - >-
        Feed the exact selected-operator result through the frozen target-
        preservation and repair semantics, reconstruct the resulting
        MutationOutcome, ActivationCertificate and accepted Case, and require
        exact equality with the supplied typed outcome before constructing a
        receipt. Co-hashing independently valid operator and outcome values is
        insufficient.
      - >-
        Bind a versioned private operator-application policy identity including
        RNG/seed semantics, source cloning, target matcher/extractor semantics and
        repair policy. Unknown or non-replayable operators fail closed.
      - preserve exact source/run/lineage/seed/assignment/certificate checks and admitted=false/context-required boundaries
    required_tests:
      - the same source/assignment/outcome rebuilt under value and nullify_value with matching registered digests rejects
      - operator swaps that happen to yield a structurally valid typed outcome still reject unless exact execution reproduces it
      - valid exact selected-operator rejected, accepted and repaired outcomes reconstruct and round-trip where reachable; unavailable exact contexts fail closed
      - wrong seed, source, assignment, operator implementation digest, repair policy or outcome rejects
      - all prior 27 Search scoped tests remain green after fixture migration
    scoped_test: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/osc/test_search_lane_registry.py tests/osc/test_search_context_receipts.py tests/osc/test_search_gate_crosswalk.py

  - task_id: OSC-6-FOUNDATION-REMEDIATE-RUNTIME-R2
    owner: /root/phase5_evidence_audit
    findings: [OSC-6-FOUNDATION-RUNTIME-R2-B1, OSC-6-FOUNDATION-RUNTIME-R2-B2, OSC-6-FOUNDATION-RUNTIME-R2-H1]
    allowed_write_paths:
      - src/datadiff_osc/runtime/_producer_provenance.py
      - src/datadiff_osc/runtime/_receipt_producers.py
      - tests/osc/test_runtime_producer_provenance.py
      - tests/osc/test_runtime_receipt_producers.py
    forbidden_write_paths:
      - all_paths_except_allowed_write_paths
    requirements:
      - >-
        Every expected provenance record has exactly one frozen origin, never an
        allowed-origin union. Frozen origins require the independently supplied
        exact SHA; REAL_EXECUTION cannot substitute for a frozen origin.
      - >-
        Every typed output declares an exact ordered role-to-raw-parent mapping.
        A closed producer/envelope-specific rebuilder must parse those exact raw
        bytes, reconstruct the real raw observation and typed receipt, rerun its
        invariants, and compare the complete canonical envelope and subject IDs.
        Missing rebuilders, malformed/swapped/extra parents or incomplete raw
        context fail closed.
      - >-
        Repository provenance must derive JUnit/log outcomes rather than accept
        an independently authored typed receipt; preserve strict TargetVersion
        and other registered typed producer derivations with equivalent exact
        raw reconstruction or reject them as context-missing.
      - >-
        For parallel scaling, independently derive one-worker and N-worker
        canonical logical-task projections and arm digests. Bind explicit worker
        counts 1 and N greater than 1 to their TaskSpecs; exclude only the frozen
        worker-multiplicity fields from logical equality. TaskKind, case,
        protocol, endpoint, dependency graph, payload and every non-worker
        resource field must match. Never assign one shared cross-arm digest to
        both receipt fields.
      - >-
        Remove caller authority over reproduced. Derive each recheck's
        reproduction from exact typed source/recheck verdict and observation
        semantics; a SATISFIED or context-incomplete recheck cannot count as a
        reproduced VIOLATED finding. If no replayable typed reproduction witness
        exists, fail closed/not_evaluated rather than accept a boolean.
      - preserve raw monotonic measurement derivation, cross-stage disjointness, confirmed-state rejection and bug_claimed=false
    required_tests:
      - malformed JUnit/log parents, raw role/order swaps, extra parents, typed/raw mismatch and missing rebuilder reject
      - a frozen record relabeled REAL_EXECUTION rejects even when all caller policy fields are self-consistent
      - independently rebuilt valid RepositoryTestReceipt provenance passes; other registered types either rebuild exactly or fail context-missing
      - BACKEND_EXECUTION versus LOCALIZATION and payload/dependency/resource/case swaps reject
      - separately derived one/N logical task-set digests match only for legitimate worker multiplicity changes
      - all six SATISFIED rechecks with caller-like true claims reject; exact VIOLATED typed reproduction derives true without trusting a bool
      - all prior 36 Runtime scoped tests remain green after fixture migration
    scoped_test: PYTHONDONTWRITEBYTECODE=1 .venv/bin/pytest -q -p no:cacheprovider tests/osc/test_runtime_producer_provenance.py tests/osc/test_runtime_receipt_producers.py

