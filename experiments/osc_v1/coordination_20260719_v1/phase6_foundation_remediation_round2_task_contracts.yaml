tasks:
  - task_id: OSC-6-FOUNDATION-REMEDIATE-SEARCH-R2
    owner: /root/phase5_consumer_audit
    finding: OSC-6-FOUNDATION-SEARCH-R2-H1
    allowed_write_paths:
      - src/datadiff_osc/search/context_receipts.py
