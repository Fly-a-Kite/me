    companion. All product code, tests, public exports, and thirteen frozen
    targets remain byte-exact.
  - >-
    The new source clone must be clean and remote-free before/after each
    checkpoint; its updated lock must be committed before it is snapshotted.
    Previous authority clone, old snapshot, old public audit, and original
    workspace are immutable inputs, never upgrade targets.
  - >-
    One read-only PyPI metadata response for polars-runtime-32 and four exact
    wheel downloads may occur after contract validation. Each selected wheel
    must be non-yanked, compatible with this Python/platform, match the public
    response SHA-256, and be written only at its declared generic filename.
  - >-
    The new venv must be built only under remediation_root, install exactly the
    full updated requirements-final.lock with --require-hashes --no-deps and no
    cache, then pass pip check and an importlib.metadata version audit. No
    package is installed, upgraded, removed, or cached outside that venv/root.
  - >-
    A fresh canonical source snapshot must bind the updated committed lock and
    source state. The revalidation must bind that snapshot, the new venv audit,
    and the seven preserved official raw source files; it must show all seven
    target versions matching or fail closed. It remains a precondition, not a
    TargetVersionReceipt.
  - >-
    A new canonical metadata-only output layout may be written under the new
    remediation root and must predeclare ten producer locations and eighteen
    plan sections while the new formal_evidence root remains absent.
