  required_invariants:
    - >-
      If an active ContextVar value can affect a cross-module direct callable's
      mutation behavior, it is precisely bound by the private application-policy
      identity or capture/replay fails closed; binding only a fresh empty Context
      default is insufficient.
    - >-
      After the active ContextVar value changes, an old policy ID must raise
      mutation operator application policy mismatch before any mutation operator
      or SeedLineage call, including on cold and warm paths.
    - >-
      The regression keeps derive_stage_lineage code, source, module, and qualname
      unchanged and replaces only the SeedLineage global with an inspectable callable
      whose behavior consumes ContextVar.get().
    - >-
      Mutable, cyclic, unresolved, uninspectable, dynamic, and unsupported context
      remains fail closed; a new identity mechanism may not make any of these accepted.
    - >-
      R5 SeedLineage global-rebind and R4 globals/defaults/kwdefaults/closure/
      recursion/Holder.STATE/module.STATE/registry replay regressions remain intact.
    - >-
      Any strengthened private digest or schema is versioned; a receipt under weaker
      semantics fails closed. Public API and public exports do not change.
    - >-
      Full MutationOutcome equality, fresh Context isolation, isolated Case cloning,
      derived MUTATION seed, target preservation, and accepted/repaired/rejected
      causal boundaries remain intact.
    - >-
      Diagnostic refs remain permanently diagnostic-only; missing exact typed context
      is fail closed or not_evaluated; a candidate never becomes confirmed and
      bug_claimed remains false.
  required_negative_review_and_regressions:
    - >-
      Cold and warm ContextVar default=0 versus active=1 regression with identical
      derive_stage_lineage code/source/module/qualname and only SeedLineage global
      substitution; active value changes policy identity or fails closed.
    - >-
      A prior receipt under default=0 fails with mutation operator application policy
      mismatch at zero mutation/SeedLineage calls after active value becomes 1.
    - >-
      ContextVar default and active-value behavior is tested for capture and replay,
      including behavior-changing cold/warm rebind.
    - >-
      Mutable/cyclic/unresolved/uninspectable/dynamic/unsupported ContextVar-related
      dependency shapes all fail closed.
    - >-
      Existing R5 and R4 negative regressions remain passing without authority promotion.
  validation:
    authorization: >-
      This exact scoped suite is authorized only once, after implementation and
      pre-suite SHA verification. It is not authorized before implementation.
    command: >-
