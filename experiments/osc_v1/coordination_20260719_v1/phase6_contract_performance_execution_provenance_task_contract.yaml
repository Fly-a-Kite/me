  required_invariants:
    - >-
      The new Runtime module is private, changes no public export, and owns one
      canonical Contract-performance execution transcript plus the raw artifact
      deterministically derived only from a reconstructed R9 proof/receipt. It
      must exact-round-trip its envelope, use no caller-selected aggregate or
      opaque provenance digest, and bind source digest, producer kind, command,
      sorted environment, stdout, stderr, zero exit, R9 receipt/proof identity,
      raw-record identities, raw artifact bytes, and local implementation bytes.
    - >-
      Reconstruction must re-read the full R9 proof via its private replayer,
      rebuild the R4/R3 receipt, re-derive raw records and raw artifact bytes,
      and fail closed for changed source, observation, receipt, command,
      environment, output, exit, artifact, counters, schema, module bytes or
      any missing/extra/unordered field. The frozen generic provenance registry
      remains untouched and no bypass or relaxed registry is permitted.
    - >-
      Root may accept a separately declared execution-provenance binding only
      for the exact ContractPerformance raw artifact of performance_paired_replay
      and only after the existing R9 admission/proof has been retained. Root
      must re-hash/re-read/reconstruct the private envelope, exact-bind its
      source, receipt, sample, admission ID, transcript output, zero exit,
      artifact ID and artifact bytes, and commit a compact verified binding into
      VerifiedArtifactReceipt.digest. Parallel proofs cannot cross-satisfy it.
    - >-
      The legal test index is intentionally incomplete and invalid/non-
      publishable. Temporary test files are structural fixtures only; they are
      not a current-worktree paper source snapshot, real launch result, raw
      authority artifact, producer-set completion, metric, manifest, bundle or
      gate evidence. No source/artifact file may be persisted outside pytest
      temporary storage.
    - >-
      Diagnostic refs remain permanently diagnostic-only; missing exact typed
      context is fail-closed/not_evaluated; candidate remains non-confirmed and
      bug_claimed remains false. Public API, gate specs, authority publication,
      combined suite, Phase 7, 2h and 24h remain unauthorized.
  required_tests:
    负向复核:
      - >-
        Change exactly one source digest, R9 proof/receipt, observation counter,
        command, environment, stdout, stderr, exit status, artifact ID, raw
        record, artifact byte, implementation hash or admission ID and assert
        private reconstruction or Root artifact retention fails before evidence
        is retained.
      - >-
        Demonstrate missing, duplicate, swapped, extra, stale, wrong-type,
        wrong-schema, path-escaping and post-admission byte mutation bindings
        fail closed; a parallel proof cannot bind a Contract artifact.
    独立反例验证:
      - >-
        Build one legal R9 proof, derive its one raw artifact, and bind it to
        one otherwise incomplete receipt index. The exact artifact binding may
        be structurally retained while the index remains invalid and
        non-publishable.
      - >-
        Change one valid raw observation and show it derives a distinct receipt,
        proof, artifact identity and bytes that cannot bind the original.
    异常输入验证:
      - >-
        Reject missing/extra fields, malformed hashes, invalid canonical
        envelopes, nonzero exit, malformed UTF-8/JSON output, unordered or
        duplicate identities, unreadable path, and unsupported legacy receipt
        without exception leakage, publication, confirmation or bug claim.
  scoped_validation:
    command: >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      tests/osc/test_runtime_phase6_contract_performance_execution_provenance.py
      tests/osc/test_runtime_phase6_contract_performance_provenance.py
      tests/osc/test_runtime_phase6_contract_performance_producers.py
      tests/osc/test_runtime_phase6_contract_performance_receipts.py
      tests/osc/test_phase6_gate_authority_integration.py
    timing: exactly once, only after all allowed implementation writes and SHA checks
    forbidden_substitutes:
