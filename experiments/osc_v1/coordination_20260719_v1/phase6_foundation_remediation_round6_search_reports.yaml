  summary:
    - >-
      ContextVar live identity now binds both its fresh-empty default and its
      current active value. Any active value that is mutable, cyclic, unresolved,
      uninspectable, dynamic, or unsupported continues to fail closed through the
      existing recursive live-context encoder.
    - >-
      The ContextVar-aware live-context, policy callable, external dependency,
      mutation application-policy, mutation receipt, and mutation attempt-ID private
      digest/schema domains were versioned. A receipt carrying the prior policy
      semantics therefore cannot be accepted as current.
    - >-
      The regression clones derive_stage_lineage while retaining code/source/module/
      qualname, changes only its SeedLineage global to an inspectable ContextVar.get()
      callable, and verifies default=0 versus active=1 cold/warm policy separation.
