    result: >-
      Added a private canonical execution transcript and raw-artifact envelope
      for exactly one R9 ContractPerformanceProductionProvenance. It rebuilds
      the R9 proof/R4 observation/R3 receipt, deterministically derives six
      private raw-counter series and canonical artifact bytes, and requires the
      exact fixed command, sorted environment, zero exit, empty stderr, stdout
