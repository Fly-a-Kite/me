    path: src/datadiff_osc/_phase6_gate_authority.py
    pre_sha256: 6520dd263b17fbcc911a6f3b46540357d402b2283d36993ef7f675176270a9ee
    post_sha256: 207db72d6a77359330a609093a19cbbc88f1a4e537a9a78de52acfc8f3aff170
    result: >-
      Root accepts the optional private execution-provenance binding only for
      a performance_paired_replay Contract artifact already anchored by an R9
      Contract-performance admission proof. It re-hashes, reads and reconstructs
      the proof, then exact-binds admission, R9 proof/receipt/sample/source,
      transcript output/zero exit, declared provenance digest, artifact ID and
      raw bytes before adding the compact verified binding to
      VerifiedArtifactReceipt.digest. Parallel or declared-only proof material
      cannot cross-satisfy this path.
