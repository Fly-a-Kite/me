global_requirements:
  - >-
    Every reviewer reads required inputs to EOF, verifies all assigned SHA values before and
    after its exactly-once scoped pytest command, and stops on a mismatch.
  - >-
    Reviews are read-only 负向复核、独立反例验证、异常输入验证 only. Each report must state
    writes=0, child_agents=0, forbidden_paths_modified=[], and deviations=[] unless a real
    deviation occurred.
  - >-
    Every Python command uses PYTHONDONTWRITEBYTECODE=1. No tests/osc directory suite,
    repository suite, parity-100000, v3-2200, Phase 7, 2h, or 24h execution is authorized.
  - >-
    Each scoped pytest command is permitted exactly once. For the Search suite, retain the
    complete terminal session: poll the original command session to exit and include exact
    exit code plus complete result. If that evidence is unavailable, do not rerun and mark the
    report incomplete.
  - >-
    Public exports, public_api_freeze.json, frozen targets, thresholds, denominators,
    comparator semantics, replay authority, provenance origin, admission authority, and
    execution authorization are immutable. Diagnostic refs remain diagnostic-only; missing
    exact typed context fails closed/not_evaluated; candidate remains non-confirmed and
    bug_claimed=false.
  - >-
    Findings must be correctness, soundness, reproducibility, authority-boundary, or missing
    negative-test findings; each includes id, severity, claim, reproduction, violated invariant,
    and required test. Root aggregation is not an independent reviewer report.
