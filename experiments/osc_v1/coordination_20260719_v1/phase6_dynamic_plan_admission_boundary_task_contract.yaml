required_invariants:
  - >-
    A valid dynamic plan has exactly the v3 schema and all eighteen record
    sections. It is byte-SHA and exact-source-digest bound, and its producer
    receipt-set digest must later equal a typed artifact receipt index digest.
  - >-
    No prospective or caller-authored placeholders may represent executed
    cases, results, outcomes, backend tasks, exact comparison decisions,
    performance pairs, target versions, repository tests, campaign/pipeline
    rechecks, or producer receipts.
  - >-
    A valid plan requires at minimum 100000 exact comparison decisions,
    exactly 11 formal lanes, 22 runs, 2200 planned/executed cases, one backend
    task coverage set per case, exactly seven frozen target packages, at least
    1000 distinct paired performance samples, nonempty parallel scaling, and
    3/3 campaign plus 3/3 pipeline rechecks for every candidate.
  - >-
    Under the present execution prohibition, the missing typed/result
    evidence must remain absent and the only honest result is fail closed; no
    plan may be named valid or given gate credit.
  - >-
    All thirteen frozen/public SHA-256 values remain exact; candidate status
    remains non-confirmed and bug_claimed=false.
negative_review_requirements:
  负向复核:
    - source digest, a schema shell, or a planned identifier cannot stand in for current typed result/evidence bindings
    - a plan with missing floors or execution sections cannot be called a dynamic gate plan
  独立反例验证:
    - the previously current-head-valid source snapshot alone has no dynamic-plan or receipt authority
  异常输入验证:
    - mismatched source/hash/schema, unordered/duplicate identities, false bug_claimed, incomplete rechecks, and malformed producer digests remain fail closed by verifier contract
forbidden:
  - dynamic plan JSON, plan template, plan payload, typed receipt index, raw artifact, producer receipt, execution result, source payload, or external temporary plan file creation
  - original workspace, R2/R3/clean-source clone, product code, tests, public exports, public API freeze, or frozen target modification
  - tests/osc, six-file combined suite, repository suite, 100000 parity, v3 2200, Phase 7, 2h, or 24h execution
  - candidate confirmation, diagnostic promotion, confirmed status, or bug_claimed=true
validation:
  test_execution_count: 0
  allowed_read_only_commands:
    - static source inspection, JSON/YAML parse, SHA/commit/tree/status/remote checks
    - exact frozen/public SHA and authority-path scope checks
  required_report_contents:
    - exact verifier floors, record/result cross-bindings, and first unavailable prerequisite
    - explicit non-creation evidence and all unchanged gate states
    - 负向复核, 独立反例验证, 异常输入验证 results
stop_conditions:
  - any dynamic-plan/receipt/artifact/execution/source-payload write
  - any source/frozen/public SHA, remote, original-worktree, or authority-scope mismatch
  - any attempted plan admission, gate credit, candidate confirmation, or bug claim
