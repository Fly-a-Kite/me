task:
  task_id: OSC-6-CONTRACT-PARALLEL-SCALING-TYPED-PRODUCER-R6
  role: root
  mode: root_serial_private_typed_parallel_scaling_producer
  objective: >-
    Add a private pure producer which derives exactly one existing R5
    ParallelScalingEvidenceReceipt from a canonical source-snapshot digest,
    immutable benchmark/environment/configuration context, a fully validated
    one-worker/six-worker ParallelScalingObservation, exact EvidenceEnvelope
    vectors, and raw monotonic task counters. It must not treat the legacy
    PairedBenchmarkReceipt as input or output, or establish any authority.
  allowed_write_paths:
    - src/datadiff_osc/runtime/_phase6_parallel_scaling_producers.py
    - tests/osc/test_runtime_phase6_parallel_scaling_producers.py
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_parallel_scaling_typed_producer_task_contract.yaml
    - experiments/osc_v1/coordination_20260719_v1/phase6_contract_parallel_scaling_typed_producer_report.yaml
    - experiments/osc_v1/coordination_20260719_v1/coordination_ledger.yaml
  forbidden_write_paths:
    - src/datadiff_osc/__init__.py
    - src/datadiff_osc/public_api_freeze.json
    - src/datadiff_osc/search/**
    - src/datadiff_osc/contract_engine/**
    - src/datadiff_osc/runtime/_receipt_producers.py
    - tests/osc/test_runtime_receipt_producers.py
    - src/datadiff_osc/runtime/_producer_provenance.py
    - tests/osc/test_runtime_producer_provenance.py
    - src/datadiff_osc/runtime/_phase6_parallel_scaling_receipts.py
    - tests/osc/test_runtime_phase6_parallel_scaling_receipts.py
    - src/datadiff_osc/runtime/_semantic_replay.py
    - tests/osc/test_runtime_semantic_replay.py
    - src/datadiff_osc/_phase6_gate_authority.py
    - tests/osc/test_phase6_gate_authority_integration.py
    - src/datadiff_osc/runtime/_phase6_contract_performance_producers.py
    - tests/osc/test_runtime_phase6_contract_performance_producers.py
    - docs/**
    - scripts/**
    - experiments/final_bug_discovery_protocol_v3/**
  frozen_interfaces:
    - osc-public-api-freeze-v1:cb505dbe665e517e53314ddae8ba9302d05ac794d326e9be1e792f8bd4e22131
    - osc-pre24-gate-spec-set-d9792996cacb6fc6e47bce602d5f7ab6d6382c62ba9e1ac6bc1f8003ecbec552
    - all thirteen frozen_target_sha256 entries above
    - frozen R5 receipt/replay/Root binding and R4 typed raw-pair producer
    - legacy PairedBenchmarkReceipt remains diagnostic-only and unowned
  required_invariants:
    - >-
      The private builder accepts only a nonempty typed one-worker and
      six-worker ParallelScalingObservation whose bindings have worker counts
      exactly 1 and 6, complete OK TypedExecutionResult values, independently
      derived logical task-set projections, equal task counts, matching clock
      domain, and raw monotonic counter start/end/interval context. It must
      derive both task-set digests separately, not accept a caller digest.
    - >-
      There is one exact NOT_A_CANDIDATE EvidenceEnvelope per worker-bound
      result, in canonical task order. Every evidence object must bind its
      result group, task, seed, contract/target fingerprint and outcome; all
      evidence/task/TaskSpec/result identities are globally distinct across
      arms, and all authoritative arm verdicts agree. Missing, extra,
      reordered, duplicate, non-OK, noncanonical, candidate-shaped or
      mismatched typed context fails closed before a receipt exists.
    - >-
      Benchmark plan, environment and arm configuration are immutable sorted
      field tuples. Source snapshot, workload, worker counts, logical task-set,
      task/result/evidence, configuration and raw-counter fields are derived
      from typed input; caller sample IDs, elapsed scalars, speedups,
      efficiencies, aggregates, booleans, floats, negatives and malformed
      digests fail closed.
    - >-
      A changed valid source snapshot, exact task/evidence/result/counter or
      configuration context derives a different private receipt identity. The
      source digest remains context only until a separate Root-owned
      artifact/provenance bridge binds it; this builder grants no provenance.
    - >-
      Never call build_paired_benchmark_receipt, never accept or emit
      PairedBenchmarkReceipt, never alter frozen R5 replay/Root behavior, and
      never create a producer receipt, artifact, cohort, corpus, metric,
      bootstrap, gate result, publication or execution authorization.
    - >-
      Diagnostic refs remain permanently diagnostic-only; missing exact typed
      context is fail-closed/not_evaluated; no candidate becomes confirmed and
      bug_claimed remains false.
  required_tests:
    负向复核:
      - >-
        Reject source/workload/configuration/task-set/result/evidence/raw
        counter/clock/worker count changes; unequal logical projections/counts;
        duplicate or reordered arm objects; missing/extra evidence; legacy
        paired receipt; caller elapsed/efficiency/sample fields; and every
        candidate/provenance/gate-shaped substitute.
    独立反例验证:
      - >-
        Construct one legal typed 1-versus-6 observation, mutate exactly one
        result/task/evidence/counter/context binding at a time, and show that
        no R5 receipt is created. A valid source rebind and valid raw-context
        change must produce a new private sample ID, never reuse the old one.
    异常输入验证:
      - >-
        Reject wrong object types, malformed/unknown schemas, invalid sorted
        context fields, non-OK outcomes, INCONCLUSIVE/non-authoritative verdicts,
        malformed digest/counter types, and all malformed logical dependency
        graphs without a throw escaping into authorization, candidate promotion,
        bug claim, publication, or execution permission.
  scoped_validation:
    command: >-
      PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      tests/osc/test_runtime_phase6_parallel_scaling_producers.py
      tests/osc/test_runtime_phase6_parallel_scaling_receipts.py
      tests/osc/test_runtime_phase6_contract_performance_producers.py
    timing: exactly once, only after all allowed implementation writes and SHA checks
    forbidden_substitutes:
      - tests/osc
      - repository suite
      - six-file combined suite
      - 100000 parity execution
      - v3 2200
      - Phase 7
      - 2h pilot
      - 24h run
  completion_requirements:
    - reverify every allowed product path, frozen R5/R4 input path and all thirteen frozen/public SHA values before the scoped suite
    - retain the exact command, exit code, and complete terminal result in the report
    - reverify every allowed product path, frozen R5/R4 input path and all thirteen frozen/public SHA values after the scoped suite
    - use apply_patch for the report and ledger only after the real terminal result is known
    - retain phase_6_contract as pending regardless of scoped-suite outcome
  stop_conditions:
    - any frozen/public SHA mismatch, staged user path, pre-existing target path, or scope expansion
    - any need to modify a public export, frozen receipt/producer/provenance/test, Root authority, gate spec, raw metric reducer, docs, or script
    - any accepted legacy paired receipt, caller-authored derived field, unbound/misbound typed context, duplicate/reused arm identity, artifact/provenance claim, publishable bundle, gate pass, candidate confirmation, or bug_claimed=true
    - failed scoped suite or incomplete terminal test evidence
